<style>

body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.5}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;min-height:44px;background:var(--gold);color:#fff;font-weight:600}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:2px solid var(--gold);display:flex;align-items:center;gap:10px;padding:8px 14px}
header b{flex:1;font-size:1.15rem;color:var(--clay)}.coins{background:var(--mar);color:#3a2000;border-radius:20px;padding:6px 12px;font-weight:700;font-size:.9rem}
nav{display:none;background:var(--card);padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:6px}nav.open{display:flex}
nav button{background:transparent;color:var(--ink);padding:8px 12px;min-height:40px}nav button.on{background:var(--leaf);color:#fff}
@media(min-width:800px){nav{display:flex;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:4}#hb{display:none}}
.bar{height:6px;background:var(--line)}.bar i{display:block;height:100%;background:var(--leaf);transition:width .6s}
main{max-width:980px;margin:0 auto;padding:16px;animation:in .4s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1,h2,h3{font-weight:700;margin:.4em 0}h2{color:var(--clay)}
.hero{background:linear-gradient(160deg,#f7c948,#e2812a 60%,#2f6b3a);color:#fff;border-radius:22px;padding:34px 20px;text-align:center}
.hero h1{font-size:clamp(1.8rem,6vw,3rem);margin:0}.hero .em{font-size:3.4rem;letter-spacing:8px}
.hero button{margin:6px;background:#fff;color:var(--clay)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 6px 16px #0002}
.big{font-size:2.4rem}.note{font-size:.85rem;color:var(--mut);background:var(--card);border-left:4px solid var(--mar);padding:8px 12px;border-radius:8px;margin:10px 0}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:var(--card);color:var(--ink);border:1.5px solid var(--line)}.opt.sel{border-color:var(--gold);background:#f8e7b8;color:#3a2a18}.opt.ok{background:#cfe9d1;color:#123;border-color:var(--leaf)}.opt.no{background:#f6cfc6;color:#411}
.stage{position:relative;height:360px;border-radius:18px;background:linear-gradient(#fbe3a6,#f3c874 55%,#b5653a 55%);overflow:hidden;border:2px solid var(--gold)}
.it{position:absolute;transform:translate(-50%,-50%);font-size:2.2rem;cursor:pointer;line-height:1}
.slot{border:2px dashed var(--gold);border-radius:12px;min-height:64px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.75rem;color:var(--mut);cursor:pointer;padding:4px}
.slot .e{font-size:1.8rem}.chip{display:inline-block;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;margin:4px;cursor:pointer;font-size:1.05rem}.chip.sel{border-color:var(--leaf);background:#dff0df;color:#123}.chip.used{opacity:.35}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2f6b3a;color:#fff;padding:12px 20px;border-radius:30px;z-index:20;animation:pop .4s;font-weight:700;text-align:center;max-width:90vw}@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
.cf{position:fixed;top:-30px;font-size:1.6rem;z-index:19;animation:fall 2s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.badge{display:inline-block;background:#f8e7b8;color:#3a2a18;border-radius:20px;padding:6px 12px;margin:4px;font-weight:600}.badge.lock{opacity:.45;filter:grayscale(1)}
.step{cursor:pointer}.step.on{border-color:var(--leaf)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
code{display:block;white-space:pre-wrap;font-size:.8rem;background:var(--bg);padding:8px;border-radius:8px;margin:6px 0}
nav{display:flex!important;flex-wrap:nowrap;overflow-x:auto;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:4;-webkit-overflow-scrolling:touch}nav button{white-space:nowrap}#hb{display:none!important}
.room{position:relative;height:380px;border-radius:18px;overflow:hidden;border:2px solid var(--gold);background:linear-gradient(#fbe7bd 0 64%,#b8763f 64%);color:#000}
.room .z{position:absolute;transform:translate(-50%,-50%);line-height:1;transition:all .3s}.room .g{border:2px dashed #a8792f;border-radius:50%;width:38px;height:38px;font-size:.6rem;display:flex;align-items:center;justify-content:center;text-align:center;color:#6b4a12;cursor:pointer;background:#fff8}
.tile{height:190px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:4.5rem;background:linear-gradient(135deg,#f7c948,#e2812a);cursor:pointer}
.lb{position:fixed;inset:0;background:#000d;z-index:15;display:flex;flex-direction:column;justify-content:center;padding:16px;color:#fff}

.hero2{position:relative;min-height:78vh;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#ffd86b,#e2812a 55%,#2f6b3a);color:#fff;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}

.cap{font-weight:700;margin:6px 0 2px}.ring{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.4rem}

.pt{position:relative;background:linear-gradient(#fbe7bd,#c98a5a);border-radius:18px;padding:18px;display:flex;flex-wrap:wrap;gap:14px;justify-content:center;border:2px solid var(--gold)}.pt span{font-size:2.8rem;cursor:pointer}
/* === Kabir AI Model & Family Celebration Styles === */
@keyframes kabirEyesBlink {
  0%, 88%, 94%, 100% { transform: scaleY(1); }
  91% { transform: scaleY(0.12); }
}
.kabir-eyes {
  transform-origin: 60px 47px;
  animation: kabirEyesBlink 3.8s infinite ease-in-out;
}
@keyframes kabirMouthTalk {
  0%, 100% { transform: scaleY(0.3) scaleX(0.9); }
  35% { transform: scaleY(1.4) scaleX(1.1); fill: #52150e; }
  70% { transform: scaleY(0.7) scaleX(1.0); }
}
.kabir-mouth-talking {
  transform-origin: 60px 65px;
  animation: kabirMouthTalk 0.2s infinite alternate ease-in-out;
}
@keyframes kabirHaloGlow {
  0%, 100% { transform: scale(0.96); opacity: 0.65; }
  50% { transform: scale(1.05); opacity: 0.95; }
}
.kabir-halo-pulse {
  transform-origin: 60px 58px;
  animation: kabirHaloGlow 3s infinite ease-in-out;
}
@keyframes kabirFloaty {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-4px); }
}
.kabir-floating-btn {
  position: fixed;
  right: 18px;
  bottom: calc(18px + env(safe-area-inset-bottom,0px));
  z-index: 99;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 16px 6px 8px;
  background: linear-gradient(135deg, #d84315, #ff8f00);
  color: #fff;
  border: 2px solid #ffd54f;
  border-radius: 40px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.35);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  animation: kabirFloaty 3.5s infinite ease-in-out;
  font-family: inherit;
  font-weight: 700;
}
.kabir-floating-btn:hover {
  transform: translateY(-2px) scale(1.03);
  box-shadow: 0 8px 24px rgba(255,143,0,0.5);
}
.fam-member-card {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s ease;
}
.fam-member-card:hover {
  transform: translateY(-3px);
  border-color: var(--gold);
  box-shadow: 0 6px 18px rgba(0,0,0,0.15);
}
.fam-member-card.active {
  border-color: var(--leaf);
  background: linear-gradient(to bottom, var(--card), rgba(47,107,58,0.08));
  box-shadow: 0 0 0 2px var(--leaf);
}
.fam-member-card.done {
  border-color: var(--gold);
}
.fam-badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 14px;
  font-size: 0.8rem;
  font-weight: bold;
}
.fam-badge.completed { background: #d4edda; color: #155724; }
.fam-badge.pending { background: #fff3cd; color: #856404; }
.audio-story-box {
  background: linear-gradient(135deg, #1e1b18 0%, #2b241c 100%);
  color: #fff;
  border: 2px solid var(--gold);
  border-radius: 20px;
  padding: 20px;
  margin-top: 15px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
}

function confetti(){for(let i=0;i<24;i++){const c=document.createElement('div');c.className='cf';c.textContent=['🎉','🌼','✨','🪔'][i%4];c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2800)}}
function addCoins(n,why){if(n<=0)return;S.coins+=n;saveProgress();toast('🎉 +'+n+' Coins! '+(why||''));confetti()}
function spendCoins(n){if(S.coins<n)return false;S.coins-=n;saveProgress();return true}
function purchaseItem(id){const it=D.shop.find(x=>x[0]==id);if(S.owned.includes(id))return toast('You already own this.');if(!spendCoins(it[3]))return toast('Not enough Festora Coins.');S.owned.push(id);saveProgress();toast('Purchased successfully!');go('Shop')}
function unlockAchievement(k){if(S.ach[k])return;S.ach[k]=1;const a=ACH.find(x=>x[0]==k);saveProgress();if(a[3]>10)addCoins(a[3],a[1]);else{toast(a[1]+' unlocked!');confetti()}}
function mark(k){if(!S.done[k]){S.done[k]=1;saveProgress()}}
function pct(){return Math.round(SECS.filter(s=>S.done[s[0]]).length/SECS.length*100)}
function check(){const h=S.house;if(S.done.house&&h.length)unlockAchievement('first');
 if(h.includes('idol')&&h.includes('diya')&&h.includes('thali')&&['garland','marigold','jasmine','basket'].some(x=>h.includes(x)))unlockAchievement('ready');
 if(['intro','traditions','food','puja','gallery','quiz','g1','g2','g3','house'].every(k=>S.done[k]))unlockAchievement('master');
 if(pct()==100)unlockAchievement('explorer')}
const tier=s=>s>=80?100:s>=60?70:s>=40?40:20;
function rewardBest(k,score,coins,label){const g=S[k];if(score>g.best)g.best=score;const extra=coins-g.paid;if(extra>0){g.paid=coins;mark(k);check();saveProgress();addCoins(extra,label)}else{mark(k);check();saveProgress();toast('Score saved. Beat your best to earn more coins!')}}
function render(p){if(!V[p])p='Overview';page=p;R=window._r||{};window._r=null;clearInterval(window._t);const m={Learn:'intro',Celebrate:'traditions',Puja:'puja',Food:'food',Watch:'gallery',Gallery:'gallery',Shop:'shop'};if(m[p])mark(m[p]);check();draw();window.scrollTo(0,0)}
function go(p,r){window._r=r;try{history.pushState({p},'','#'+encodeURIComponent(p))}catch(e){}render(p)}
window.onpopstate=()=>render(decodeURIComponent(location.hash.slice(1))||'Overview');
function bar(){if(page=='Overview')return'';const t=/^G\d$/.test(page)?'Games':'Overview';return`<div class="row" style="margin-bottom:8px"><button class="alt" onclick="go('${t}')">← Back to ${t=='Games'?'Play Zone':'Ganesh Chaturthi'}</button><small style="color:var(--mut)">Home / Ganesh Chaturthi / ${page.replace(/^G(\d)$/,'Game $1')}</small></div>`}
function foot(){if(!/^G\d$/.test(page))return'';const n=+page[1];return`<div class="row" style="margin-top:16px"><button class="alt" onclick="go('Games')">Back to Play Zone</button><button onclick="go('${n<3?'G'+(n+1):'Shop'}')">${n<3?'Next game →':'Open Shop →'}</button><button class="alt" onclick="go('Progress')">View rewards</button></div>`}
function esc(s){return s}
function draw(){document.getElementById('coins').textContent='🪙 '+S.coins+' Festora Coins';
 document.getElementById('pb').style.width=pct()+'%';
 document.getElementById('nav').innerHTML=PAGES.map(p=>`<button class="${p==page||(p=='Games'&&/^G\d$/.test(page))?'on':''}" onclick="go('${p}')">${p}</button>`).join('');
 const _vfn = (V[page] || (typeof V2!=='undefined'&&V2[page]) || (typeof GP!=='undefined'&&GP[page]) || V.Overview); document.getElementById('app').innerHTML=bar()+_vfn()+foot();saveProgress()}

Learn:()=>`<h2>What is Ganesh Chaturthi?</h2><div class="grid">
<div class="card"><h3>What</h3>A Hindu festival honouring Lord Ganesha, the elephant-headed deity of new beginnings, wisdom and the remover of obstacles.</div>
<div class="card"><h3>Why</h3>It marks Ganesha's birth as told in tradition: the son of Shiva and Parvati. Devotees begin new ventures with his blessings.</div>
<div class="card"><h3>When</h3>Falls on the fourth day (chaturthi) of the bright fortnight of the Hindu month of Bhadrapada, usually in August–September. The observance lasts from a day and a half to about ten days, ending on Anant Chaturdashi in many places.</div>
<div class="card"><h3>Who</h3>Millions of Hindu families and communities celebrate, and people of many backgrounds join public festivities.</div></div>
<h3>Where</h3><div>${D.regions.map(r=>`<span class="badge">📍 ${r}</span>`).join('')}</div>
<h2>History &amp; Significance</h2><div class="grid">
<div class="card"><h3>📜 Historical background</h3>Ganesha worship is ancient and appears in many regions. Home celebrations have long existed; the public form grew in Maharashtra in the late 19th century when Lokmanya Tilak encouraged community festivals in Pune.</div>
<div class="card"><h3>🙏 Religious significance</h3>Ganesha is invoked first in many rituals and beginnings, for wisdom and the removal of obstacles.</div>
<div class="card"><h3>🤝 Cultural importance</h3>Art, music, drama and craft flourish around the festival, including idol makers' work.</div>
<div class="card"><h3>🏘️ Community celebrations</h3>Neighbourhood pandals bring people together with prayers, performances and shared food.</div>
<div class="card"><h3>🌱 Modern celebrations</h3>Many now choose clay idols, natural colours and eco-friendly decorations and immersion.</div></div>
<div class="note">Traditions vary by region, community and family. This is a general overview, not the only way to celebrate.</div>
<h2>What People Wear</h2><div class="grid">${[['🥻','Sarees','Silk or cotton sarees, draped in regional styles.'],['👘','Kurta','Kurta with pyjama or dhoti for many.'],['🩱','Dhoti / veshti','Traditional wrapped garments in several regions.'],['👗','Salwar suits','Comfortable festive wear for many ages.'],['🎽','Regional dress','Each community has its own attire; no single dress code exists.']].map(c=>`<div class="card"><div class="big">${c[0]}</div><b>${c[1]}</b><br>${c[2]}</div>`).join('')}</div>
<h2>Festival Decorations</h2><div class="grid">${[['💐','Flower garlands'],['🍃','Banana leaves'],['🎏','Toran (door hanging)'],['🔶','Rangoli'],['🪔','Diyas'],['✨','Decorative lights'],['♻️','Eco-friendly decor']].map(c=>`<div class="card"><span class="big">${c[0]}</span> ${c[1]}</div>`).join('')}</div>
<h2>Unity in Diversity</h2><div class="card">👨‍👩‍👧 Families · 🧒 Children · 🧑 Young adults · 🧓 Elders · 🤝 Community groups – praying, decorating, cooking and sharing together across backgrounds.</div>
<p><button onclick="go('Celebrate')">Next: How it's celebrated →</button></p>`,

    if (S.tr[cacheKey] && S.tr[cacheKeyT]) {
      dispTitle = S.tr[cacheKeyT];
      dispText = S.tr[cacheKey];
    } else {
      isTranslating = true;
      dispText = "Translating into regional language...";
      
      // Async fetch translation
      if (!window.isFetchingTr) {
        window.isFetchingTr = true;
        Promise.all([
          fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${targetCode}&dt=t&q=${encodeURIComponent(englishTitle)}`).then(r=>r.json()),
          fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${targetCode}&dt=t&q=${encodeURIComponent(englishText)}`).then(r=>r.json())
        ]).then(([d1, d2]) => {
          S.tr[cacheKeyT] = d1[0].map(x=>x[0]).join('');
          S.tr[cacheKey] = d2[0].map(x=>x[0]).join('');
          saveProgress();
          window.isFetchingTr = false;
          draw();
        }).catch(e => {
          console.error(e);
          S.tr[cacheKeyT] = englishTitle; // fallback
          S.tr[cacheKey] = englishText;
          window.isFetchingTr = false;
          draw();
        });
      }
    }
  }
  
  window.speakChap = function() {
    if (isTranslating) return; // Wait for translation
    const txt = dispTitle + ". " + dispText;
    const m = new SpeechSynthesisUtterance(txt);
    m.lang = st.l;
    
    // Voice selection based on Gents (Kabir) vs Ladies (Alena)
    const allVoices = (window.speechSynthesis ? window.speechSynthesis.getVoices() : []);
    const langPrefix = (st.l || 'en-IN').split('-')[0];
    const langVoices = allVoices.filter(v => v.lang.startsWith(langPrefix));
    
    if ((st.model || window.currentSelectedModel) === 'alena') {
      m.pitch = 1.18;
      m.rate = 1.0;

      if (femaleVoice) m.voice = femaleVoice;
    } else {
      m.pitch = 0.92;
      m.rate = 0.98;
      const maleVoice = langVoices.find(v => /male|man|david|rishi|ravi|george|mark|amit|ajay/i.test(v.name)) || (langVoices.length > 1 ? langVoices[1] : langVoices[0]);
      if (maleVoice) m.voice = maleVoice;
    }

          mouth.style.height = st.f ? '15px' : '4px';
          mouth.style.borderRadius = st.f ? '50%' : '10px';
        }
      }, 170); 
    };
    m.onend = () => { 
      st.sp = false; st.paused = false;
      clearInterval(window.flapInt); st.f=false;
      const mouth = document.getElementById('story-avatar-mouth');
      if (mouth) { mouth.style.height = '4px'; mouth.style.borderRadius = '10px'; }
      if(st.ap && st.c < maxChap) { 
        st.c++; draw(); setTimeout(window.speakChap, 1000);
      } else { 
        draw(); 
      } 
    };
    window.currentUtterance = m;
    window.speechSynthesis.speak(m);
  };
  
  window.playChap = function() {

Story:()=>{
  const g=G$[cur]||{name:cur=='diwali'?'Diwali':cur=='ganesh'?'Ganesh Chaturthi':'Festival',place:'India',bg:'#ff9f1c'};
  const st = R.st || (R.st = { l:'en-IN', c:0, sp:false, p:1.0, r:1.0, ap:false, f:false, b:false, paused:false });
  st.model = window.currentSelectedModel || st.model || 'kabir';
  
  let actualStory;
  if (cur === 'diwali') {
    actualStory = DW.story;
  } else if (cur === 'ganesh') {
    actualStory = D.steps;
  } else if (Array.isArray(g.story)) {
    actualStory = g.story;
  } else if (typeof g.story === 'string' && g.story.trim().length > 0) {
    actualStory = [
      [g.e || '📖', 'The Spirit of ' + g.name, g.story],
      ['✨', 'Sacred Traditions', 'Devotees gather with deep reverence in ' + (g.place || 'India') + ' to observe the timeless rituals of ' + g.name + ' with community feasts and prayers.'],
      ['🙏', 'Blessings & Harmony', 'The auspicious celebration of ' + g.name + ' brings peace, prosperity, and joy to every family and home.']
    ];
  } else {
    actualStory = [
      [g.e || '📖', 'Story of ' + g.name, 'Celebrating the sacred heritage and divine glory of ' + g.name + ' with family and community.']
    ];
  }
  const maxChap = actualStory.length - 1;
  if (st.c > maxChap) st.c = 0;
  
  const expandText = (shortText, festName, chapIndex) => {
    const templates = [
      " The ancient traditions of " + festName + " are deeply rooted in these early practices. Passed down through generations, this marks the beginning of the sacred preparations. Families gather to honor the customs that define their cultural heritage.",
      " This vital step showcases the vibrant spirit of " + festName + ". The atmosphere is filled with anticipation and joy. Across different regions, people add their own unique touch to this beautiful tradition, uniting the community.",
      " During " + festName + ", this ritual is performed with utmost devotion and care. The intricate details reflect centuries of artistic and spiritual evolution. It serves as a reminder of the timeless values celebrated during the festivities.",
      " As the celebration of " + festName + " reaches its peak, this practice brings everyone together. The sounds, colors, and aromas create an unforgettable experience. It is a moment of pure celebration and spiritual reflection.",
      " The culmination of " + festName + " involves sharing these joyous moments with loved ones. It highlights the importance of harmony and togetherness. The legacy of these practices continues to inspire future generations.",
      " Beyond the rituals, " + festName + " leaves a lasting impact on the community. The values of compassion and unity are reinforced through these actions. It carries a universal message of ecological respect and peace."
    ];
    return shortText + templates[chapIndex % templates.length];
  };
  
  const currentChapter = actualStory[st.c];
  const englishTitle = currentChapter[1];
  const englishText = expandText(currentChapter[2], g.name, st.c);
  
  S.tr = S.tr || {};
  const targetCode = st.l.split('-')[0];
  const needsTranslation = (st.l !== 'en-IN');
  
  let dispTitle = englishTitle;
  let dispText = englishText;
  let isTranslating = false;
  
  if (needsTranslation) {
    const cacheKeyT = targetCode + '|' + englishTitle;
    const cacheKey = targetCode + '|' + englishText;
    
    if (S.tr[cacheKey] && S.tr[cacheKeyT]) {
      dispTitle = S.tr[cacheKeyT];
      dispText = S.tr[cacheKey];
    } else {
      isTranslating = true;
      dispText = "Translating into regional language...";
      
      // Async fetch translation
      if (!window.isFetchingTr) {
        window.isFetchingTr = true;
        Promise.all([
          fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${targetCode}&dt=t&q=${encodeURIComponent(englishTitle)}`).then(r=>r.json()),
          fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${targetCode}&dt=t&q=${encodeURIComponent(englishText)}`).then(r=>r.json())
        ]).then(([d1, d2]) => {
          S.tr[cacheKeyT] = d1[0].map(x=>x[0]).join('');
          S.tr[cacheKey] = d2[0].map(x=>x[0]).join('');
          saveProgress();
          window.isFetchingTr = false;
          draw();
        }).catch(e => {
          console.error(e);
          S.tr[cacheKeyT] = englishTitle; // fallback
          S.tr[cacheKey] = englishText;
          window.isFetchingTr = false;
          draw();
        });
      }
    }
  }
  
  window.speakChap = function() {
    if (isTranslating) return; // Wait for translation
    const txt = dispTitle + ". " + dispText;
    const m = new SpeechSynthesisUtterance(txt);
    m.lang = st.l;
    
    // Voice selection based on Gents (Kabir) vs Ladies (Alena)
    const allVoices = (window.speechSynthesis ? window.speechSynthesis.getVoices() : []);
    const langPrefix = (st.l || 'en-IN').split('-')[0];
    const langVoices = allVoices.filter(v => v.lang.startsWith(langPrefix));
    
    if ((st.model || window.currentSelectedModel) === 'alena') {
      m.pitch = 1.18;
      m.rate = 1.0;
      const femaleVoice = langVoices.find(v => /female|woman|zira|susan|swara|heera|leena|priya|neerja|kavya|shreya/i.test(v.name)) || langVoices[0];
      if (femaleVoice) m.voice = femaleVoice;
    } else {
      m.pitch = 0.92;
      m.rate = 0.98;
      const maleVoice = langVoices.find(v => /male|man|david|rishi|ravi|george|mark|amit|ajay/i.test(v.name)) || (langVoices.length > 1 ? langVoices[1] : langVoices[0]);
      if (maleVoice) m.voice = maleVoice;
    }
    m.onstart = () => { 
      st.sp = true; st.paused = false; draw(); 
      window.flapInt = setInterval(()=>{
        st.f=!st.f;
        const mouth = document.getElementById('story-avatar-mouth');
        if (mouth) {
          mouth.style.height = st.f ? '15px' : '4px';
          mouth.style.borderRadius = st.f ? '50%' : '10px';
        }
      }, 170); 
    };
    m.onend = () => { 
      st.sp = false; st.paused = false;
      clearInterval(window.flapInt); st.f=false;
      const mouth = document.getElementById('story-avatar-mouth');
      if (mouth) { mouth.style.height = '4px'; mouth.style.borderRadius = '10px'; }
      if(st.ap && st.c < maxChap) { 
        st.c++; draw(); setTimeout(window.speakChap, 1000);
      } else { 
        draw(); 
      } 
    };
    window.currentUtterance = m;
    window.speechSynthesis.speak(m);
  };
  
  window.playChap = function() {
    window.speechSynthesis.cancel();
    // Start fresh to ensure Cloud Voices don't get locked up
    setTimeout(() => {
       window.speakChap();
    }, 100);
  };
  
  window.pauseChap = function() {
    // FORCE hard stop. Cloud voices ignore .pause() in Chrome.
    window.speechSynthesis.cancel();
    st.sp = false;
    st.paused = false;
    clearInterval(window.flapInt);
    st.f = false;
    const mouth = document.getElementById('story-avatar-mouth');
    if (mouth) { mouth.style.height = '4px'; mouth.style.borderRadius = '10px'; }
    draw();
  };
  
  window.changeLang = function(val) {
    st.l = val;
    window.speechSynthesis.cancel();
    st.sp = false; st.paused = false;
    clearInterval(window.flapInt);
    st.f = false;
    draw();
  };
  
  const langNames = {'en-IN':'English','hi-IN':'Hindi','kn-IN':'Kannada','te-IN':'Telugu','ta-IN':'Tamil','ml-IN':'Malayalam'};
  
  return `<h2>${g.name} Audio Story</h2>
  <div class="card" style="background:#222; color:#fff; display:flex; gap:20px; align-items:center;">
    <div style="flex:1; text-align:center;">
      <div style="display:flex; justify-content:center; gap:8px; margin-bottom:12px;">
        <button type="button" id="btn-model-kabir" onclick="window.selectAiModel('kabir')" style="background:${st.model!='alena'?'linear-gradient(135deg,#f59e0b,#d97706)':'#333'}; color:#fff; border:2px solid ${st.model!='alena'?'#f59e0b':'#555'}; border-radius:20px; padding:6px 12px; font-size:0.85rem; font-weight:bold; cursor:pointer; display:flex; align-items:center; gap:5px; box-shadow:${st.model!='alena'?'0 2px 10px rgba(245,158,11,0.4)':''}">
          <span>👨‍💼</span> Kabir
        </button>
        <button type="button" id="btn-model-alena" onclick="window.selectAiModel('alena')" style="background:${st.model=='alena'?'linear-gradient(135deg,#ec4899,#be185d)':'#333'}; color:#fff; border:2px solid ${st.model=='alena'?'#ec4899':'#555'}; border-radius:20px; padding:6px 12px; font-size:0.85rem; font-weight:bold; cursor:pointer; display:flex; align-items:center; gap:5px; box-shadow:${st.model=='alena'?'0 2px 10px rgba(236,72,153,0.4)':''}">
          <span>👩‍💼</span> Alena
        </button>
      </div>

      <div style="position:relative; width:130px; height:130px; margin:0 auto; border-radius:50%; overflow:hidden; border:4px solid ${st.model=='alena'?'#ec4899':'#f59e0b'}; box-shadow:${st.sp?(st.model=='alena'?'0 0 25px rgba(236,72,153,0.8)':'0 0 25px rgba(245,158,11,0.8)'):'0 4px 15px rgba(0,0,0,0.5)'}; transition:all 0.3s ease;">
        <img id="story-avatar-img" src="${st.model=='alena'?(st.sp?'assets/models/alena_talking.jpg':'assets/models/alena_smile.jpg'):(st.sp?'assets/models/kabir_talking.jpg':'assets/models/kabir_smile.jpg')}" 
             alt="${st.model=='alena'?'Alena AI Guide':'Kabir AI Guide'}" 
             style="width:100%; height:100%; object-fit:cover; display:block; transform:${st.sp?'scale(1.06)':'scale(1.0)'}; transition:transform 0.3s ease;">
        ${st.sp ? `<div style="position:absolute; bottom:8px; right:8px; background:#10b981; border:2px solid #fff; width:16px; height:16px; border-radius:50%; box-shadow:0 0 8px #10b981;"></div>` : ''}
      </div>
      <div id="story-avatar-badge" style="margin-top:8px; font-size:0.95rem; font-weight:bold; color:${st.model=='alena'?'#f472b6':'#fbbf24'};">
        ${st.model=='alena' ? '👩‍💼 Alena' : '👨‍💼 Kabir'}
      </div>
      
      <select onchange="changeLang(this.value)" style="margin-top:15px; width:100%; padding:5px; background:#333; color:#fff; border:1px solid #555; border-radius:4px;">
        <option value="en-IN" ${st.l=='en-IN'?'selected':''}>English Voice</option>
        <option value="hi-IN" ${st.l=='hi-IN'?'selected':''}>Hindi Voice</option>
        <option value="kn-IN" ${st.l=='kn-IN'?'selected':''}>Kannada Voice</option>
        <option value="te-IN" ${st.l=='te-IN'?'selected':''}>Telugu Voice</option>
        <option value="ta-IN" ${st.l=='ta-IN'?'selected':''}>Tamil Voice</option>
        <option value="ml-IN" ${st.l=='ml-IN'?'selected':''}>Malayalam Voice</option>
      </select>

      <div style="margin-top:10px; display:flex; gap:10px; justify-content:center;">
        <button onclick="playChap()" ${isTranslating?'disabled':''} style="background:${isTranslating?'#555':'#2f6b3a'}; padding:8px 15px; border-radius:20px; flex:1;">▶ Play</button>
        <button onclick="pauseChap()" style="background:#b02a2a; padding:8px 15px; border-radius:20px; flex:1;">⏸ Pause</button>
      </div>
    </div>
    <div style="flex:2;">
      <div style="display:flex; justify-content:space-between; align-items:baseline;">
        <h3 style="margin:0; font-size:1.4rem;">${dispTitle}</h3>
        <span style="color:#aaa; font-size:0.9rem;">Chapter ${st.c+1} of ${maxChap+1} · ${langNames[st.l]}</span>
      </div>
      <p style="line-height:1.6; font-size:1.1rem; margin-top:10px; ${isTranslating?'opacity:0.5':''}">${dispText}</p>
      <div style="display:flex; justify-content:space-between; margin-top:20px">
        <button ${st.c==0?'disabled':''} onclick="R.st.c--; window.speechSynthesis.cancel(); R.st.sp=false; R.st.paused=false; draw()">❮</button>
        <div>${actualStory.map((_,i)=>`<span style="cursor:pointer; color:${st.c==i?'#ff9f1c':'#555'}; margin:0 4px; font-size:1.2rem;" onclick="R.st.c=${i}; window.speechSynthesis.cancel(); R.st.sp=false; R.st.paused=false; draw()">●</span>`).join('')}</div>
        <button ${st.c==maxChap?'disabled':''} onclick="R.st.c++; window.speechSynthesis.cancel(); R.st.sp=false; R.st.paused=false; draw()">❯</button>
      </div>
    </div>
  </div>`;
},
Gallery:()=>{const g=G$[cur]||{name:'Festival',place:'India',bg:'#ff9f1c'};return `<h2>${g.name} Gallery</h2><div class="note">Explore real photos of how ${g.name} is celebrated.</div><div class="grid">${[['PEOPLE','Celebration','people celebrating ' + g.name + ' festival traditional clothes ' + (g.place||'India')],['FOOD','Feast','traditional food sweets for ' + g.name + ' festival India'],['DECORATION','Decorations','beautiful decorations for ' + g.name + ' festival India'],['PUJA','Rituals','rituals and prayers for ' + g.name + ' festival'],['PEOPLE','Community','crowd celebrating ' + g.name + ' festival'],['ALL','Vibe','grand celebration of ' + g.name + ' festival night view']].map((x,i)=>'<div class="card" style="min-height:160px;background:'+g.bg+';position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;"><h3 style="margin:0;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.5)">'+x[1]+'</h3><button style="margin-top:15px;background:#fff;color:#333;font-weight:bold;padding:8px 12px;border-radius:20px;box-shadow:0 2px 5px rgba(0,0,0,0.2)" onclick="window.open(\'https://www.google.com/search?tbm=isch&q=\' + encodeURIComponent(\''+x[2]+' real photos\'), \'_blank\')">🔍 View Real Photos</button></div>').join('')}</div>`},

  Learn:()=>{const g=G$[cur],r=g.reg[R.r];return`<h2>Learn about ${g.name}</h2><div class="grid" style="grid-template-columns:repeat(2,1fr)">${g.reg.map((x,i)=>`<div onclick="R.r=${i};draw()">${gt(x[0],100)}<div class="cap">${x[1]}</div></div>`).join('')}</div>${r?`<div class="card" style="margin-top:10px"><h3>${r[1]}</h3>${r[2]}</div>`:''}<div class="note">Customs vary by region, community and family.</div>`},

  return gUI(1);

function rgIdx(c,r,cols){return r*cols+c}

function rgRing(cols,rows){const e=[];for(let c=0;c<cols-1;c++)e.push([rgIdx(c,0,cols),rgIdx(c+1,0,cols)]);for(let r=0;r<rows-1;r++)e.push([rgIdx(cols-1,r,cols),rgIdx(cols-1,r+1,cols)]);for(let c=cols-1;c>0;c--)e.push([rgIdx(c,rows-1,cols),rgIdx(c-1,rows-1,cols)]);for(let r=rows-1;r>0;r--)e.push([rgIdx(0,r,cols),rgIdx(0,r-1,cols)]);return e}
function rgCenter(cols,rows){return rgIdx(Math.floor((cols-1)/2),Math.floor((rows-1)/2),cols)}
function rgStar(cols,rows,step){const ctr=rgCenter(cols,rows),e=[];let n=0;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const i=rgIdx(c,r,cols),perim=(r==0||r==rows-1||c==0||c==cols-1);if(perim&&i!=ctr){n++;if(n%step==0)e.push([ctr,i])}}return e}
function rgSpokesIn(cols,rows){const e=[];for(let r=1;r<rows-1;r++)for(let c=1;c<cols-1;c++)e.push([rgIdx(c,r,cols),rgIdx(c,r-1,cols)]);return e}

 draw()}

// Web Audio API ritual chime sound
window.playRitualChime = function(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    
    if (type === 'bell') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.4, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
      osc.start();
      osc.stop(ctx.currentTime + 1.2);
    } else if (type === 'prasad') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
      osc.start();
      osc.stop(ctx.currentTime + 0.8);
    } else if (type === 'blessing') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, ctx.currentTime);
      gain.gain.setValueAtTime(0.35, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.8);
      osc.start();
      osc.stop(ctx.currentTime + 1.8);
    } else {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.9);
      osc.start();
      osc.stop(ctx.currentTime + 0.9);
    }
  } catch(e) {}
};

window.kabirSpeak = function(text, onEnd) {
  if (!window.kabirVoiceEnabled || !('speechSynthesis' in window)) {
    if (onEnd) onEnd();
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text.replace(/[🪔🕉️🌺✨🔔🎉👨‍👩‍👧‍👦]/g, ''));
  utter.rate = 0.95;
  utter.pitch = 1.05;
  utter.onstart = () => {
    window.kabirIsTalking = true;
    updateKabirAvatars(true);
  };
  utter.onend = () => {
    window.kabirIsTalking = false;
    updateKabirAvatars(false);
    if (onEnd) onEnd();
  };
  utter.onerror = () => {
    window.kabirIsTalking = false;
    updateKabirAvatars(false);
    if (onEnd) onEnd();
  };
  window.speechSynthesis.speak(utter);
};

function updateKabirAvatars(talking) {
  document.querySelectorAll('.kabir-mouth').forEach(el => {
    if (talking) el.classList.add('kabir-mouth-talking');
    else el.classList.remove('kabir-mouth-talking');
  });
  const liveStatus = document.getElementById('kabir-live-status');
  if (liveStatus) {
    liveStatus.textContent = talking ? '🎙️ Kabir is speaking...' : '✨ Kabir is listening...';
  }
}

    </div>

    </div>
  `;
  const m = document.getElementById('cm');
  if (m) m.scrollTop = m.scrollHeight;
}

const _oldSay = say;
say = function(t) {
  const inp = document.getElementById('ci');
  t = t || (inp ? inp.value.trim() : '');
  if (!t) return;
  if (inp) inp.value = '';
  CH.push(['u', t.replace(/</g, '&lt;')]);
  CH.push(['b', '…']);
  kabirChatDraw();
  setTimeout(() => {
    const ans = kabirReply(t);
    CH[CH.length - 1] = ['b', ans];
    kabirChatDraw();
    window.kabirSpeak(ans);
  }, 500);
};

const _oldChatToggle = chatToggle;
chatToggle = function() {
  const c = document.getElementById('chat');
  if (!c) return;
  const isOpening = (c.style.display !== 'flex');
  c.style.display = isOpening ? 'flex' : 'none';
  if (isOpening) {
    kabirChatDraw();
    if (CH.length === 1) {
      window.kabirSpeak("Namaste! I am Kabir, your AI Cultural Guide. How may I assist your festival celebration today?");
    }
  }
};

V2.Rangoli=()=>{if(!R.rg)rgStartLevel(0,'copy');const st=R.rg,unlocked=i=>i==0||RGF().done.includes(i-1)||RGF().done.includes(i);
 const modeBtns=[['copy','Copy'],['complete','Complete'],['memory','Memory'],['free','Free']].map(([id,l])=>`<button class="${st.mode==id?'':'alt'}" style="padding:6px 10px" onclick="rgMode('${id}')">${l}</button>`).join(' ');
 const levelBtns=st.mode!='free'?RL_LEVELS.map((l,i)=>`<button class="${st.level==i?'':'alt'}" style="padding:6px 10px" ${unlocked(i)?'':'disabled'} onclick="rgStartLevel(${i},'${st.mode}')">${i+1}</button>`).join(' '):'';
 let ref='';
 if(st.mode=='free')ref=`<p class="note">No reference — design your own Rangoli, then tap Check for a symmetry &amp; coin score.</p>`;
 else if(st.mode=='memory'&&!st.memHidden)ref=`<p class="note">Memorize this pattern — hiding in a moment…</p>${rgBoard(st.dots,st.target.map(([a,b])=>({a,b})),{})}`;
 else if(st.mode=='memory'&&st.memHidden)ref=`<p class="note">Now recreate it from memory 👇</p>`;
 else ref=`<p class="note">Reference — recreate this pattern on the board below</p>${rgBoard(st.dots,st.target.map(([a,b])=>({a,b})),{})}`;
 const givenSegs=(st.given||[]).map(([a,b])=>({a,b,color:'#9a8fae',dash:true}));
 const playerSegs=st.playerEdges.map(([a,b])=>({a,b,color:'var(--gold)'}));
 const board=rgBoard(st.dots,[...givenSegs,...playerSegs],{tap:st.status!='success',sel:st.sel});
 const status=st.status=='success'?`<div class="card" style="border:2px solid var(--leaf)">Beautiful Rangoli! 🪔✨ +${st.reward+20} coins<br>${st.level<RL_LEVELS.length-1?`<button onclick="rgNext()">Next Level →</button>`:'You completed every level! 🎉'}</div>`
  :st.status=='partial'?`<div class="card" style="border:2px solid var(--mar)">Almost there! 😊 ${st.missingCount} connection(s) still missing. Check for extra lines you may need to remove.</div>`
  :st.status=='fail'?`<div class="card" style="border:2px solid #c1121f">Keep trying — tap Reset and give it another go.</div>`
  :st.mode=='free'&&st.status=='free-done'?'':'';
 const freeResult=st.mode=='free'&&st.status=='free-done'?`<div class="card" style="border:2px solid var(--leaf)">Lovely design! 🪔 Symmetry ${st.lastSym}% — coins added.</div>`:'';
 return`<h2>Diwali Rangoli Challenge 🪔</h2><p>🪙 ${S.coins} coins${st.mode!='free'?` · Level ${st.level+1}: ${st.name} (${st.diff})`+(st.sec>0?` · ⏱️ <span id="rgtm">${st.t}</span>s`:''):''}</p>
 <div class="row" style="justify-content:center">${modeBtns}</div>
 ${levelBtns?`<div class="row" style="justify-content:center;margin-top:6px">${levelBtns}</div>`:''}
 ${ref}
 <p class="note" style="margin-top:10px">${st.mode=='complete'?'Grey dashed lines are given — tap dots to add the rest.':'Tap two dots in a row to connect them.'}</p>
 ${board}
 <div class="row" style="justify-content:center">${st.playerEdges.length&&st.status!='success'?`<button class="alt" onclick="rgUndo()">Undo</button>`:''}${st.status!='success'?`<button class="alt" onclick="rgReset()">Reset</button><button onclick="rgCheck()">${st.mode=='free'?'Check Design':'Check Rangoli'}</button>`:''}</div>
 ${status}${freeResult}
 <p style="text-align:center"><button class="alt" onclick="go('Games')">← Back to Games</button></p>`};

// --- CERTIFICATE GENERATOR ---
function downloadCert(score) {
    let userName = localStorage.getItem('festora_name');
    if (!userName) {
        userName = prompt("Enter your name for the certificate:");
        if (!userName) return; // cancelled
        localStorage.setItem('festora_name', userName);
    }
    
    const canvas = document.createElement('canvas');
    canvas.width = 800; canvas.height = 600;
    const ctx = canvas.getContext('2d');
    
    // Draw background
    const grad = ctx.createLinearGradient(0,0,800,600);
    grad.addColorStop(0, '#fbe3a6');
    grad.addColorStop(1, '#b5653a');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,800,600);
    
    // Border
    ctx.strokeStyle = '#c9931a';
    ctx.lineWidth = 15;
    ctx.strokeRect(20, 20, 760, 560);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(28, 28, 744, 544);
    
    // Text
    ctx.textAlign = 'center';
    ctx.fillStyle = '#3a2a18';
    ctx.font = 'bold 48px Georgia';
    ctx.fillText('Certificate of Completion', 400, 120);
    
    ctx.font = 'italic 24px Georgia';
    ctx.fillText('This certifies that', 400, 200);
    
    ctx.font = 'bold 56px Arial';
    ctx.fillStyle = '#2f6b3a';
    ctx.fillText(userName, 400, 280);
    
    ctx.font = '24px Georgia';
    ctx.fillStyle = '#3a2a18';
    ctx.fillText('has successfully completed the Festora Quiz', 400, 360);
    
    ctx.font = 'bold 32px Georgia';
    ctx.fillText('Score: ' + score + ' / 10', 400, 430);
    
    ctx.font = '20px Arial';
    ctx.fillStyle = '#7a6650';
    const dateStr = new Date().toLocaleDateString();
    ctx.fillText('Date: ' + dateStr, 400, 520);
    
    // Trigger download
    const link = document.createElement('a');
    link.download = 'Festora_Certificate.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
}

// --- TEXT TO SPEECH (MULTI-LANGUAGE) ---
function speakStep(text) {
    if(!('speechSynthesis' in window)) {
        alert("Your browser does not support text-to-speech.");
        return;
    }
    window.speechSynthesis.cancel(); // stop any ongoing speech
    const utter = new SpeechSynthesisUtterance(text);
    const langSelect = document.getElementById('ttsLang');
    if(langSelect) {
        utter.lang = langSelect.value;
    }
    window.speechSynthesis.speak(utter);
}

nga). Brahma flew up as a swan to find the top, and Vishnu burrowed as a boar to find the base. Neither succeeded, humbling their ego and revealing that the divine has neither beginning nor end."},{"icon":"🛕","title":"The Beacon on Mount Arunachala","text":"On the full moon night of Karthigai, the sacred flame is lit atop Mount Arunachala. Over a million pilgrims perform the 14 km barefoot circumambulation (Giri Pradakshina) around the mountain, while every Tamil home glows with hundreds of earthen Agal Vilakku lamps."}],"vids":[{"title":"Tiruvannamalai Maha Deepam: Lighting the Fire on Arunachala","ytId":"k8L5M3n7P9q","channel":"Doordarshan National","desc":"Witness the breathtaking moment the giant ghee cauldron is lit atop the sacred mountain as thousands chant \"Annamalaiyarukku Harohara!\"."}],"food":[{"e":"🍬","name":"Appam & Pori Urundai","desc":"Crispy sweet jaggery-rice appams and crunchy puffed rice balls bound with molten cardamom jaggery syrup."}],"rituals":[{"icon":"🪔","title":"Agal Vilakku Rows","desc":"Lining every balcony, threshold, and window with small terracotta oil lamps to banish spiritual darkness."}],"q":[["On which sacred mountain is the giant Karthigai Maha Deepam lit?","🛕","Mount Arunachala|Mount Kailash|Palani Hills|Tirumala","The flame is lit on Mount Arunachala in Tiruvannamalai, revered as the fire manifestation of Lord Shiva."]],"g1":{"name":"Arunachala Flame Beacon","ty":"tap","e":"🪔","d":"Kindle the eternal Jyotirlinga fire on the mountaintop!","sec":25,"tgt":"🪔","decoy":"💨"},"g2":{"name":"Agal Vilakku Deepam Rows","ty":"mem","e":"🔥","d":"Match the sacred terracotta lamps of Tiruvannamalai","sec":30,"pairs":["🪔","🔥","🛕","✨","🌕","🔱"]}},{"id":"thaipusam","name":"Thaipusam","e":"⚡","state":"Tamil Nadu","tag":"Lord Murugan Invincible Spear & The Kavadi Penance","c1":"#b91c1c","c2":"#fbbf24","place":"Palani, Tamil Nadu & Global Diaspora","hint":"murugan, kavadi, vel, palani","fl":["⚡","🦚","🛕","🥥","✨"],"didYouKnow":"Did you know? Devotees carrying the \"Kavadi\" (a decorated semi-circular wooden canopy) undergo 48 days of strict fasting and meditation. Remarkably, many pierce their cheeks and tongues with small silver spears (Vel), feeling no pain and shedding no blood due to deep spiritual trance (Arul)!","story":[{"icon":"🦚","title":"The Gift of the Divine Vel","text":"When the asura Soorapadman terrorized the worlds, Goddess Parvati forged the invincible divine spear (Vel) and gifted it to her son Lord Murugan. Murugan vanquished the demon, transforming him into a peacock (his vehicle) and a rooster (his emblem)."},{"icon":"🪵","title":"The Burden of Kavadi","text":"Sage Agastya disciple Idumban was tasked with carrying two sacred hills strapped across his shoulders. Lord Murugan tested his devotion by standing on the hill. The Kavadi Aattam dance today symbolizes surrendering one burden and ego at the feet of the Lord."}],"vids":[{"title":"Thaipusam: Faith, Penance & Kavadi Aattam","ytId":"x7M9L2p4Q5r","channel":"National Geographic Documentary","desc":"A profound exploration of the devotion, intense physical preparation, and trance states of Murugan devotees during Thaipusam."}],"food":[{"e":"🍯","name":"Palani Panchamirtham","desc":"The world-famous GI-tagged divine jam made of five natural ingredients: hillside bananas, kandasari sugar, cow ghee, honey, and cardamom."}],"rituals":[{"icon":"🏺","title":"Paal Kavadi","desc":"Carrying brass pots of fresh milk over long barefoot journeys to bathe the deity Murugan in milk abhishekham."}],"q":[["What divine weapon did Goddess Parvati gift to Lord Murugan for Thaipusam?","⚡","The Vel (Spear)|Trishul|Bow and Arrow|Chakra","The Vel represents divine wisdom and sharp spiritual intellect that pierces through ignorance."]],"g1":{"name":"Invincible Vel Piercing","ty":"tap","e":"⚡","d":"Channel Murugan divine spear of wisdom!","sec":20,"tgt":"⚡","decoy":"🌑"},"g2":{"name":"Kavadi Aattam Penance","ty":"mem","e":"🦚","d":"Match the peacock feathers, brass milk pots, and Vel","sec":35,"pairs":["⚡","🦚","🛕","🥥","✨","🪵"]}},{"id":"onam","name":"Onam","e":"🌸","state":"Kerala","tag":"The Homecoming of King Mahabali & The 26-Dish Sadhya","c1":"#eab308","c2":"#15803d","place":"Kerala & Worldwide Malayalis","hint":"mahabali, sadhya, pookkalam, vallam kali","fl":["🌸","👑","🚣","🍌","🐅","✨"],"didYouKnow":"Did you know? Onam celebrates an Asura (demon king), King Mahabali, because his reign was so egalitarian that there was no poverty, crime, deceit, or caste discrimination in Kerala! When Lord Vishnu as Vamana asked for three paces of land, Mahabali humbly offered his own head for the third step, earning the boon to visit his beloved people once every year.","story":[{"icon":"👑","title":"The Golden Age of Mahabali","text":"The famous ancient folk song \"Maveli nadu vaneedum kalam\" sings of an era where all humans were equal, joy was universal, and lies were unknown. The gods grew envious, prompting Lord Vishnu to test Mahabali devotion as the dwarven Brahmin Vamana."},{"icon":"🚣","title":"Vallam Kali Snake Boat Race","text":"On the sacred Pampa River at Aranmula and Punnamada Lake in Alappuzha, 100-foot-long Chundan Vallams (snake boats) powered by 100 synchronized rowers surge forward to rhythmic boat songs (Vanchipattu)."},{"icon":"🌸","title":"Pookkalam & Onasadya","text":"For 10 days starting from Atham to Thiruvonam, homes create geometric flower carpets (Pookkalam) expanding each day. Thiruvonam culminates with Onasadya: a vegetarian royal banquet of 26 dishes served strictly on fresh banana leaves."}],"vids":[{"title":"The Grand Spirit of Onam: Pookkalam to Sadhya","ytId":"w0YQ9X4zW2s","channel":"Kerala Tourism Official","desc":"Experience the magic of Thiruvonam, Athachamayam royal carnival in Thripunithura, and the preparation of a 26-course grand Onasadya."},{"title":"Nehru Trophy Snake Boat Race (Vallam Kali) Live Action","ytId":"p5aE3zT7kM0","channel":"Incredible India","desc":"Feel the adrenaline of 100 oars slicing through Kerala backwaters in perfect rhythm as thousands cheer on the banks."}],"food":[{"e":"🍌","name":"Onasadya 26-Dish Feast","desc":"Banana leaf banquet featuring Avial, Olan, Thoran, Kalan, Erissery, Sambar, Pachadi, and Inji Puli."},{"e":"🍨","name":"Palada Pradhaman","desc":"Slow-simmered dessert of delicate rice flakes (ada) cooked in condensed milk, cardamom, and caramelized jaggery or sugar."}],"rituals":[{"icon":"🌸","title":"Pookkalam Design","desc":"Arranging fresh indigenous flower petals in concentric circular patterns outside the front porch."},{"icon":"👑","title":"Onathappan Worship","desc":"Installing small pyramid-shaped clay structures representing Lord Vamana and King Mahabali."}],"q":[["Why do the people of Kerala eagerly await King Mahabali on Onam?","👑","He was a just king during whose reign all were equal|He gave gold to everyone|He was a fierce warrior|He discovered spices","Under King Mahabali, society experienced complete peace, equality, and absence of deceit."]],"g1":{"name":"Vallam Kali Snake Boat Race","ty":"rhy","e":"🚣","d":"Paddle in rhythm to the thunderous Vanchipattu boat song!","sec":30,"lanes":["🚣","🌺","👑","🥁"]},"g2":{"name":"Pookkalam Mandala Quest","ty":"mem","e":"🌸","d":"Match the 10 floral layers of King Mahabali welcome","sec":35,"pairs":["🌸","👑","🚣","🍌","🐅","✨"]}},{"id":"thrissur","name":"Thrissur Pooram","e":"🐘","state":"Kerala","tag":"The Mother of All Poorams & The 36-Hour Percussion Symphony","c1":"#b45309","c2":"#dc2626","place":"Thekkinkadu Maidan, Thrissur, Kerala","hint":"pooram, kudamattom, ilanjithara melam, elephants","fl":["🐘","🥁","☂️","✨","🛕"],"didYouKnow":"Did you know? Thrissur Pooram was created in 1798 by Raja Rama Varma (Sakthan Thampuran). When heavy rains prevented local temples from attending the Arattupuzha Pooram, the King defied the temple ban and united 10 temples to create their own grand secular carnival around Vadakkunnathan Temple!","story":[{"icon":"👑","title":"Sakthan Thampuran Revolution","text":"Raja Rama Varma broke the monopoly of conservative temple authorities by establishing Thrissur Pooram as an open cultural festival where all communities, artists, and craftsmen collaborated regardless of background."},{"icon":"🥁","title":"Ilanjithara Melam","text":"Under the historic Ilanji tree, 250 master instrumentalists perform the world largest traditional percussion symphony using Chenda, Kurumkuzhal, Kombu, and Elathalam for over four spellbinding hours."},{"icon":"☂️","title":"Kudamattom Umbrella Clash","text":"Two rival temple factions (Paramekkavu and Thiruvambadi) face each other with 15 grandly caparisoned tuskers, swiftly unfurling layers of dazzling silk umbrellas in a competitive, lightning-fast display."}],"vids":[{"title":"Thrissur Pooram: The Greatest Sound & Color Spectacle","ytId":"s4K8m2N1p7w","channel":"National Geographic Asia","desc":"Witness the spine-chilling Ilanjithara Melam percussion and the hypnotic Kudamattom silk umbrella exchange."}],"food":[{"e":"🫓","name":"Thrissur Vellayappam & Stew","desc":"Lacy fermented rice appams served with mild coconut milk vegetable or potato stew."}],"rituals":[{"icon":"☂️","title":"Kudamattom","desc":"Synchronized lifting and swapping of handcrafted sequined multi-colored parasols atop elephants."}],"q":[["Who founded Thrissur Pooram in 1798?","👑","Sakthan Thampuran (Raja Rama Varma)|Marthanda Varma|Tipu Sultan|Pazhassi Raja","Sakthan Thampuran unified local temples to establish this legendary festival."]],"g1":{"name":"Kudamattom Parasol Clash","ty":"tap","e":"☂️","d":"Swap the shimmering royal silk umbrellas with lightning speed!","sec":25,"tgt":"☂️","decoy":"☁️"},"g2":{"name":"Ilanjithara Melam Percussion","ty":"rhy","e":"🥁","d":"Play the 250-instrument percussion symphony in unison!","sec":30,"lanes":["🥁","☂️","🐘","🛕"]}},{"id":"attukal","name":"Attukal Pongala","e":"🏺","state":"Kerala","tag":"Guinness World Record: The Largest Women Congregation on Earth","c1":"#dc2626","c2":"#f59e0b","place":"Thiruvananthapuram, Kerala","hint":"guinness, kannaki, women festival, pongala","fl":["🏺","🔥","🪔","🌾","✨"],"didYouKnow":"Did you know? Attukal Pongala holds the Guinness World Record for the single largest gathering of women for a religious activity—over 4.5 million women gather in a single day across a 10 km radius in Thiruvananthapuram, setting up roadside brick hearths to cook sweet porridge together!","story":[{"icon":"🔥","title":"The Legend of Kannaki Rage","text":"The festival honors Kannaki, the legendary heroine of the ancient Tamil epic Silappadikaram. When her innocent husband was wrongfully executed by the Pandyan King, her blazing grief burned Madurai. She later retreated to Attukal, where women welcomed her with sweet rice to soothe her grief and honor her divine power."},{"icon":"🏺","title":"The City-Wide Sacred Kitchen","text":"On the 9th day, streets, lanes, and compound walls for miles transform into open-air kitchens. When the sacred fire from the temple sanctum is passed from hearth to hearth, millions of earthen pots bubble in unison."}],"vids":[{"title":"Attukal Pongala: The 4.5 Million Women Phenomenon","ytId":"b8K1v3N6m0q","channel":"Doordarshan India","desc":"Explore the world record festival where Thiruvananthapuram turns into the world largest open-air kitchen of sisterhood and devotion."}],"food":[{"e":"🍯","name":"Therali Appam & Mandaputtu","desc":"Steamed rice dumplings wrapped in aromatic bay leaves (vazhana ela) with jaggery and coconut."}],"rituals":[{"icon":"🔥","title":"Aduppu Vettu","desc":"Lighting the brick hearths using the sanctified fire handed from the sanctum sanctorum."}],"q":[["Which legendary epic heroine is honored during Attukal Pongala?","🔥","Kannaki (from Silappadikaram)|Draupadi|Sita|Damayanti","The festival honors Kannaki divine manifestation as Goddess Attukal Amma."]],"g1":{"name":"Sacred Hearth Fire Pass","ty":"tap","e":"🔥","d":"Spread the sanctified flame from hearth to hearth!","sec":25,"tgt":"🔥","decoy":"💧"},"g2":{"name":"Kannaki Sweet Pongala Pairs","ty":"mem","e":"🏺","d":"Match the clay pots, jaggery syrup, and bay leaves","sec":30,"pairs":["🏺","🔥","🪔","🌾","✨","🍯"]}},{"id":"pulikali","name":"Pulikali (Tiger Dance)","e":"🐅","state":"Kerala","tag":"The 200-Year-Old Roaring Folk Carnival of Painted Tigers","c1":"#f97316","c2":"#1e293b","place":"Swaraj Round, Thrissur, Kerala","hint":"tiger dance, body paint, chenda, onam","fl":["🐅","🥁","🎨","⚡","🎉"],"didYouKnow":"Did you know? Painting a single Pulikali dancer body takes over 6 to 8 hours! Artists meticulously paint realistic tiger stripes, whiskers, and predatory eyes across the dancers chests and bellies. When the heavy-set dancers bounce and shake their bellies, the painted tiger faces appear to literally roar and blink!","story":[{"icon":"👑","title":"Origins Under Sakthan Thampuran","text":"Introduced over 200 years ago by King Sakthan Thampuran, the royal army soldiers performed high-spirited martial steps mimicking wild tigers and hunters to celebrate bravery and physical vigor during Onam."},{"icon":"🐅","title":"The Street Theater Spectacle","text":"On the 4th day of Onam (Nalaam Onam), hundreds of painted tigers and hunters holding dummy rifles parade around Thrissur Swaraj Round, dancing frenetically to thunderous Chenda and Thakil percussion beats."}],"vids":[{"title":"Pulikali: The Incredible Tiger Dance of Kerala","ytId":"p9L2v4M6n1q","channel":"Incredible India Culture","desc":"Witness the intense 8-hour body painting process and the electric evening tiger parade through Thrissur."}],"food":[{"e":"🍌","name":"Sharkara Varatti & Upperi","desc":"Thick raw plantain chips coated in molten ginger-cardamom jaggery and crisp coconut-oil salted banana chips."}],"rituals":[{"icon":"🎨","title":"Belly Shaking Roar","desc":"Dancers contracting their abdominal muscles to make the painted tiger faces flex and roar."}],"q":[["How long does it typically take to body-paint a Pulikali tiger dancer?","🐅","6 to 8 hours|15 minutes|2 days|1 hour","Each dancer undergoes 6 to 8 hours of painstaking artistic tempera body painting."]],"g1":{"name":"Tiger Dance Reflex Leap","ty":"tap","e":"🐅","d":"Match the ferocious tiger belly roars and Chenda steps!","sec":20,"tgt":"🐅","decoy":"🌿"},"g2":{"name":"Thrissur Tiger Stripes Match","ty":"mem","e":"🎨","d":"Match painted leopards, yellow tigers, and hunters","sec":30,"pairs":["🐅","🥁","🎨","⚡","🎉","👑"]}},{"id":"dasara","name":"Mysore Dasara","e":"🛕","state":"Karnataka","tag":"The 400-Year-Old Royal Victory of Goddess Chamundeshwari","c1":"#b45309","c2":"#b91c1c","place":"Mysuru, Karnataka","hint":"mysore palace, jumbo savari, golden howdah, chamundi","fl":["🛕","🐘","👑","✨","🗡️"],"didYouKnow":"Did you know? During Dasara, the magnificent Mysore Palace is illuminated by exactly 100,000 incandescent light bulbs! The grand Jumbo Savari procession features a lead elephant carrying the 750 kg solid-gold howdah holding the idol of Goddess Chamundeshwari.","story":[{"icon":"🗡️","title":"Slaying of Mahishasura","text":"The demon king Mahishasura, who could not be slain by any man or god, terrorized the world from Chamundi Hills. The devas pooled their divine energies to create Goddess Chamundeshwari (Durga), who battled and vanquished the demon after a 10-day war."},{"icon":"👑","title":"Wadiyar Royal Heritage (1610)","text":"Raja Wadiyar I initiated the grand public Dasara celebration at Srirangapatna in 1610. When the capital moved to Mysore, the festival became a world-renowned exhibition of art, classical music, wrestling tournaments, and royal pageantry."}],"vids":[{"title":"Mysore Dasara: Royal Jumbo Savari & 100,000 Palace Lights","ytId":"w5M2v8N9t1q","channel":"Incredible India Heritage","desc":"Experience the grandeur of the Mysore Palace illumination, torchlight parade, and the 750 kg golden howdah elephant march."}],"food":[{"e":"🧈","name":"Mysore Pak","desc":"The legendary royal melt-in-the-mouth sweet created in the Mysore Palace kitchens using gram flour, sugar syrup, and copious pure ghee."},{"e":"🍚","name":"Bisi Bele Bath","desc":"Spiced hot lentil-rice delicacy infused with freshly roasted spices, tamarind, cashews, and seasonal vegetables."}],"rituals":[{"icon":"🐘","title":"Jumbo Savari","desc":"The ceremonial march of decorated royal elephants from Mysore Palace to the Bannimantap grounds."}],"q":[["How much does the solid-gold howdah carried by the lead elephant weigh?","👑","750 kg|100 kg|2,000 kg|50 kg","The magnificent royal howdah contains 750 kilograms of pure gold."]],"g1":{"name":"Golden Howdah Elephant March","ty":"tap","e":"🐘","d":"Escort the 750 kg golden howdah safely through Mysuru!","sec":25,"tgt":"🐘","decoy":"🪨"},"g2":{"name":"100,000 Palace Lights Memory","ty":"mem","e":"🛕","d":"Match Chamundeshwari weapons and illuminated palace arches","sec":35,"pairs":["🛕","🐘","👑","✨","🗡️","🧈"]}},{"id":"karaga","name":"Bengaluru Karaga","e":"🌸","state":"Karnataka","tag":"Bengaluru 800-Year-Old Oldest Festival & The Draupadi Shaktyotsava","c1":"#be185d","c2":"#7c3aed","place":"Tigalarpet, Bengaluru, Karnataka","hint":"karaga, draupadi, thigala, jasmine pot","fl":["🌸","🪔","🗡️","✨","🌙"],"didYouKnow":"Did you know? Bengaluru Karaga is the oldest continuous festival of Bengaluru (over 800 years old). A male priest from the Thigala community, dressed in a woman saree and bangles, carries a tall conical floral pot (Karaga) on his bare head through the streets all night long—without touching it with his hands—and the pot never falls!","story":[{"icon":"🗡️","title":"The Veerakumaras of Draupadi","text":"In the Mahabharata, when a demon named Timirasura attacked, Draupadi manifested her fierce form as Shakti and created an army of valiant warriors called Veerakumaras. Before ascending to heaven, she promised to return to earth every year on Chaitra Purnima to bless them."},{"icon":"🤝","title":"Communal Harmony at Mastan Saab Dargah","text":"In a stunning 300-year-old tradition of interfaith harmony, the midnight Karaga procession stops at the historic Hazrat Tawakkal Mastan Dargah in Cottonpet, where the Sufi shrine and the Hindu priest exchange lemons, blessings, and prayers."}],"vids":[{"title":"Bengaluru Karaga: The 800-Year-Old Midnight Legend","ytId":"b9M4v2N7q1w","channel":"Doordarshan Archives","desc":"Follow the spellbinding midnight journey of the floral Karaga carrier balancing the sacred floral pyramid through the old alleys of Bengaluru."}],"food":[{"e":"🍚","name":"Puliyogare & Pongal","desc":"Spicy tangy tamarind rice cooked with peanuts and curry leaves, distributed as sacred prasad."}],"rituals":[{"icon":"🌸","title":"Hands-Free Karaga Balance","desc":"Carrying the sacred floral pyramid on the head without touching it, guided by bare-chested Veerakumaras with drawn swords."}],"q":[["Which historic shrine does the Bengaluru Karaga visit to symbolize communal harmony?","🤝","Hazrat Tawakkal Mastan Dargah|St. Mary Basilica|Tipu Sultan Fort|Cubbon Park","The procession visits the Sufi Dargah in Cottonpet, carrying on centuries of brotherhood."]],"g1":{"name":"Hands-Free Floral Pot Balance","ty":"tap","e":"🌸","d":"Keep the sacred jasmine Karaga balanced on the priest head!","sec":25,"tgt":"🌸","decoy":"💨"},"g2":{"name":"Veerakumaras Sword Shield Pairs","ty":"mem","e":"🗡️","d":"Match Draupadi warrior symbols and jasmine wreaths","sec":30,"pairs":["🌸","🪔","🗡️","✨","🌙","🤝"]}},{"id":"kambala","name":"Kambala Buffalo Race","e":"🐂","state":"Karnataka","tag":"The Supersonic Mud-Slush Buffalo Sprint of Coastal Tulu Nadu","c1":"#78350f","c2":"#d97706","place":"Mangaluru, Udupi & Coastal Karnataka","hint":"kambala, buffalo race, mud sprint, tulu nadu","fl":["🐂","⚡","💧","🌾","🚩"],"didYouKnow":"Did you know? Kambala jockeys run barefoot alongside a pair of roaring buffaloes through knee-deep mud and water at mind-boggling speeds! In 2020, Kambala runner Srinivasa Gowda clocked 100 meters in an astonishing 9.55 seconds—faster than Usain Bolt world record!","story":[{"icon":"🌾","title":"Farmers Thanksgiving to Lord Kadri Manjunatha","text":"Originating over 800 years ago with the royal Hoysala and Alupa kings, coastal Tulu farming families raced their buffaloes across flooded paddy fields as a tribute to Lord Manjunatha for protecting cattle from sickness and ensuring fertile harvests."},{"icon":"⚡","title":"The Roaring Mud Tracks","text":"Two parallel muddy tracks (Kare) named Surya and Chandra are illuminated by stadium floodlights. As laser timers record down to the millisecond, whipped waves of mud spray into the night air as crowds roar in ecstasy."}],"vids":[{"title":"Kambala: The Mud-Slinging Speed Demons of Karnataka","ytId":"m7L4p1Q9t2w","channel":"National Geographic India","desc":"Experience the electrifying mud races, the bond between farmers and their prize buffaloes, and the lightning-fast speed of Kambala jockeys."}],"food":[{"e":"🥥","name":"Neer Dosa & Kori Rotti","desc":"Paper-thin delicate rice crepes and crisp rice wafers drenched in fiery Mangalorean coconut curry."}],"rituals":[{"icon":"🐂","title":"Kane Halage Track Splash","desc":"Testing who can splash muddy water highest against a measured cloth beam suspended above the track."}],"q":[["What animal is raced in the coastal Karnataka sport of Kambala?","🐂","Water Buffaloes|Horses|Camels|Bulls","Trained pairs of water buffaloes sprint across slushy mud tracks guided by elite runners."]],"g1":{"name":"Supersonic Mud Buffalo Sprint","ty":"tap","e":"🐂","d":"Sprint through knee-deep mud alongside the champion buffaloes!","sec":20,"tgt":"🐂","decoy":"💧"},"g2":{"name":"Tulu Nadu Paddy Field Heritage","ty":"mem","e":"⚡","d":"Match the racing whips, paddy shoots, and water tracks","sec":30,"pairs":["🐂","⚡","💧","🌾","🚩","🏆"]}},{"id":"durga","name":"Durga Puja","e":"🌺","state":"West Bengal","tag":"UNESCO Intangible Cultural Heritage: The Homecoming of the Mother","c1":"#be123c","c2":"#fbbf24","place":"Kolkata, West Bengal & Global Bengalis","hint":"durga puja, dhunuchi, sindoor khela, pandal","fl":["🌺","🥁","🪔","🔱","✨"],"didYouKnow":"Did you know? In Bengal, Goddess Durga is worshipped not merely as a fierce demon-slaying goddess, but warmly as a beloved married daughter (Uma) returning to her maternal home for 5 days with her four children: Lakshmi, Saraswati, Ganesha, and Kartikeya!","story":[{"icon":"🔱","title":"Akalbodhan: The Autumn Awakening","text":"Traditionally, Durga Puja was held in spring. Before marching to Lanka, Lord Rama performed an untimely awakening (Akalbodhan) of Goddess Durga in autumn, offering 108 blue lotuses (even ready to offer his own lotus-like eye) to seek her blessings to defeat Ravana."},{"icon":"🎨","title":"The World Largest Public Art Biennale","text":"In Kolkata, over 3,000 pandals are architectural marvels constructed from bamboo, terracotta, eco-fabrics, and clay. UNESCO declared it an Intangible Cultural Heritage of Humanity in 2021, celebrating its inclusivity and public artistic genius."},{"icon":"🥁","title":"Dhunuchi Naach & Sindoor Khela","text":"On Mahashtami, men and women balance clay censers of burning coconut husk and camphor in their hands, mouth, and forehead, dancing to the hypnotic beat of the Dhak drums. On Dashami, married women bid farewell to the Mother with red vermilion in Sindoor Khela."}],"vids":[{"title":"Durga Puja in Kolkata: UNESCO Heritage Documentary","ytId":"D4uF6_h8C0Q","channel":"UNESCO Cultural Heritage","desc":"Experience the world largest open-air art exhibition, the thunderous Dhak beats, and the emotional farewell of Dashami."},{"title":"Dhunuchi Naach & The Rhythms of Bengal","ytId":"sXQ9Xv5sR6k","channel":"Incredible India Culture","desc":"Watch the mesmerizing incense dance performed with smoking clay braziers to the rhythm of master Dhakis."}],"food":[{"e":"🍬","name":"Mishti Doi & Rosogolla","desc":"Caramelized baked fermented sweet yogurt in earthen pots and spongy cottage cheese dumplings soaked in warm sugar syrup."},{"e":"🍛","name":"Bhog Khichuri & Labra","desc":"Gobindobhog rice s fields of golden wheat ripple in the spring breeze, farmers rejoice with thunderous Bhangra and Gidda folk dances. At the Golden Temple in Amritsar, millions partake in the round-the-clock free community kitchen (Langar)."}],"vids":[{"title":"The Birth of the Khalsa: Baisakhi at Anandpur Sahib","ytId":"b8M1v4N7q2w","channel":"Doordarshan Heritage","desc":"Explore the historic fortress of Anandpur Sahib and the 1699 creation of the Khalsa brotherhood by Guru Gobind Singh."}],"food":[{"e":"🫓","name":"Makki di Roti & Sarson da Saag","desc":"Fresh mustard greens slow-cooked with bathua, garlic, and ginger, served with yellow cornmeal flatbread and white butter."},{"e":"🥛","name":"Kesar Lassi","desc":"Thick churned creamy yogurt drink topped with clotted malai and saffron."}],"rituals":[{"icon":"⚔️","title":"Nagar Kirtan","desc":"Joyful community religious processions led by five baptized Sikhs carrying the Nishan Sahib flag."}],"q":[["Which monumental event occurred on Baisakhi in 1699?","⚔️","Creation of the Khalsa Panth by Guru Gobind Singh|Building of the Golden Temple|Battle of Panipat|Treaty of Amritsar","Guru Gobind Singh established the Khalsa brotherhood and the Five Ks on Baisakhi in 1699."]],"g1":{"name":"Golden Wheat Harvest Swathe","ty":"tap","e":"🌾","d":"Harvest ripe golden wheat sheaves under the spring sun!","sec":25,"tgt":"🌾","decoy":"🍂"},"g2":{"name":"1699 Khalsa Panj Pyare Memory","ty":"mem","e":"⚔️","d":"Match the Five Ks (Kesh, Kangha, Kara, Kachera, Kirpan)","sec":35,"pairs":["🌾","⚔️","🥁","✨","🛕","👑"]}},{"id":"holamohalla","name":"Hola Mohalla","e":"⚔️","state":"Punjab","tag":"The Martial Arts Festival of the Nihang Warriors","c1":"#1e3a8a","c2":"#d97706","place":"Anandpur Sahib, Punjab","hint":"nihang, gatka, martial arts, horseback","fl":["⚔️","🐎","🏹","🚩","✨"],"didYouKnow":"Did you know? While Holi is celebrated with colors elsewhere, Guru Gobind Singh established Hola Mohalla the following day in 1701 as a military festival of mock battles, Gatka swordsmanship, and horseback archery to ensure his community remained ever-ready to defend truth and justice!","story":[{"icon":"⚔️","title":"The Nihang Blue Warriors","text":"Nihangs (the warrior order founded by the Sikh Gurus) wear majestic electric-blue robes, high conical turbans (Dumaala) adorned with steel quoits (Chakkars), and carry traditional swords, shields, and spears."},{"icon":"🐎","title":"Daredevil Equestrian Feats","text":"Warriors gallop standing atop two charging horses simultaneously, demonstrate tent pegging with long lances at full gallop, and duel with curved talwars in synchronized Gatka bouts."}],"vids":[{"title":"Hola Mohalla: The Fierce Warrior Festival of Punjab","ytId":"h9M3v1N6q2w","channel":"BBC Travel Documentary","desc":"Witness the electrifying Gatka duels, galloping horse archery, and the electric-blue sea of Nihang warriors at Anandpur Sahib."}],"food":[{"e":"🥣","name":"Karha Prasad & Kheer","desc":"Sacred whole-wheat halwa prepared in pure ghee with equal parts flour, sugar, and water."}],"rituals":[{"icon":"🐎","title":"Tent Pegging & Gatka","desc":"Skillful equestrian lance work and traditional Sikh sword and shield fencing bouts."}],"q":[["What sets Hola Mohalla apart from ordinary Holi celebrations?","⚔️","It focuses on martial arts, equestrian feats, and mock battles|It is celebrated only indoors|It uses only black paint|No one is allowed to speak","Guru Gobind Singh created it as a festival of courage, martial exercises, and defensive arts."]],"g1":{"name":"Nihang Gatka Sword Deflection","ty":"tap","e":"⚔️","d":"Parry spinning curved talwars in martial Gatka fencing!","sec":20,"tgt":"⚔️","decoy":"🛡️"},"g2":{"name":"Galloping Horse Archery Pairs","ty":"mem","e":"🐎","d":"Match warrior spears, blue turbans, and steel quoits","sec":30,"pairs":["⚔️","🐎","🏹","🚩","✨","🛡️"]}},{"id":"kilaraipur","name":"Kila Raipur Rural Olympics","e":"🚜","state":"Punjab","tag":"India Famous Rural Olympics & Feats of Human Strength","c1":"#15803d","c2":"#f59e0b","place":"Ludhiana, Punjab","hint":"rural olympics, bullock cart, tractor stunt, strength","fl":["🚜","🐂","⚡","🏆","🎉"],"didYouKnow":"Did you know? Started in 1933 by philanthropist Inder Singh Grewal, the Kila Raipur Sports Festival is recognized globally as the \"Rural Olympics of India\"! Village athletes perform astounding feats like pulling heavy tractors with their teeth, riding horses bareback, and high-speed bullock cart races!","story":[{"icon":"🏆","title":"A Century of Village Glory","text":"Grewal envisioned a sports carnival where agrarian youths could channel their formidable natural strength, endurance, and rural camaraderie into sporting excellence outside conventional urban arenas."},{"icon":"⚡","title":"Unbelievable Feats of Strength","text":"Spectators from around the world gather to watch octogenarian sprinters, daredevils balancing ploughs on their mouths, tractor wheelie stunts, and Kabaddi championships."}],"vids":[{"title":"Kila Raipur: Inside India Incredible Rural Olympics","ytId":"k7M4v2N8q1w","channel":"National Geographic India","desc":"Witness the jaw-dropping spectacles of human endurance, bullock sprints, and rural athletic pride in Ludhiana."}],"food":[{"e":"🥛","name":"Pinni & Desi Ghee Jalebi","desc":"Hearty whole-wheat and dry fruit energy pinnis and giant crispy jalebis deep-fried in desi ghee."}],"rituals":[{"icon":"🏆","title":"Tractor Pull by Teeth","desc":"Daredevil village strongmen pulling agricultural tractors and cars using ropes gripped between their teeth."}],"q":[["What is the Kila Raipur festival popularly known as across the world?","🏆","Rural Olympics of India|The Winter Derby|The Asian Games|The Desert Sprint","It is internationally famed as the Rural Olympics, showcasing indigenous feats of strength and village athletics."]],"g1":{"name":"Rural Olympics Tractor Pull","ty":"tap","e":"🚜","d":"Pull the giant agricultural tractor across the finish line!","sec":20,"tgt":"🚜","decoy":"🛑"},"g2":{"name":"Village ing a perforated earthen pot containing a lamp symbolizing the spark of life."}],"q":[["What does the Sanskrit word \"Garba\" originally mean?","🪔","Womb (the vessel of life)|Dance|Lamp|Stick","Garba stems from Garbha (womb), celebrating the Goddess as the eternal mother of creation."]],"g1":{"name":"Dandiya Raas Beat Synchrony","ty":"rhy","e":"🪔","d":"Clack the wooden dandiya sticks in rotating circles!","sec":30,"lanes":["🪔","💃","🕺","🥁"]},"g2":{"name":"Garbha Deep Sacred Mandalas","ty":"mem","e":"💃","d":"Match the mirrored Chaniya Cholis and perforated clay lamps","sec":35,"pairs":["🪔","💃","🕺","🥁","✨","🫓"]}},{"id":"tarnetar","name":"Tarnetar Fair","e":"☂️","state":"Gujarat","tag":"The Legendary Tribal Matchmaking Fair & The Mirrored Umbrellas","c1":"#dc2626","c2":"#0891b2","place":"Thangadh, Surendranagar, Gujarat","hint":"tarnetar, mirrored umbrella, draupadi swayamvar, rabari","fl":["☂️","🪞","🥁","✨","💍"],"didYouKnow":"Did you know? Legend says the Tarnetar Fair is held at the exact site where Arjuna pierced the eye of the rotating fish looking only at its water reflection to win Draupadi in her Swayamvara! Young tribal men (Kolis, Rabaris, and Bharwads) spend months hand-embroidering elaborate, mirrored umbrellas to court prospective brides at the fair!","story":[{"icon":"🏹","title":"Arjuna Archery Feat","text":"The 10th-century Trinetreshwar Mahadev Temple marks the sacred mythological Kund where Arjuna successfully struck the Matsyavedha target, winning Draupadi hand. The fair has celebrated love and unions ever since."},{"icon":"☂️","title":"The Mirrored Umbrella Courtship","text":"Eligible young men walk across the fair holding vibrant parasols adorned with tiny round mirrors, lace, and peacock embroidery. When a young woman approaches and converses about the intricate embroidery, a marriage proposal is sparked."}],"vids":[{"title":"Tarnetar Fair: Romance, Mirrored Umbrellas & Tribal Lore","ytId":"t7M3v8N1q4w","channel":"Incredible India Culture","desc":"Witness the ancient tribal matchmaking festival where men showcase hand-embroidered umbrellas and folk Raas dances."}],"food":[{"e":"🍲","name":"Kathiyawadi Sev Tameta & Rotla","desc":"Spiced tomato-sev curry served with thick bajra (millet) rotlas roasted over cow-dung embers with white butter."}],"rituals":[{"icon":"☂️","title":"Chhatri Display","desc":"Showcasing months of hand-stitched mirror embroidery on umbrellas to find a life partner."}],"q":[["Which epic Mahabharata event is believed to have occurred at the site of the Tarnetar Fair?","🏹","Arjuna Matsyavedha (archery challenge for Draupadi)|The dice game|Bhishma vow|Kurukshetra war","Legend associates the Trinetreshwar temple with Arjuna hitting the eye of the fish to win Draupadi."]],"g1":{"name":"Arjuna Matsyavedha Target Strike","ty":"tap","e":"🏹","d":"Pierce the eye of the rotating fish looking into water reflection!","sec":20,"tgt":"🏹","decoy":"🐟"},"g2":{"name":"Mirrored Embroidery Umbrellas","ty":"mem","e":"☂️","d":"Match the hand-embroidered mirror patterns and silver bangles","sec":30,"pairs":["☂️","🪞","🥁","✨","💍","🏹"]}},{"id":"pushkar","name":"Pushkar Camel Fair","e":"🐪","state":"Rajasthan","tag":"The World Largest Camel Fair & The Sacred Brahma Lake","c1":"#ea580c","c2":"#9333ea","place":"Pushkar, Rajasthan","hint":"pushkar, camel, brahma temple, kartik purnima","fl":["🐪","🏜️","🪔","🎪","✨"],"didYouKnow":"Did you know? Pushkar hosts the world only prominent temple dedicated to Lord Brahma! According to legend, Lord Brahma dropped a lotus flower (Pushpa) from his hand (Kar) onto the earth, creating the holy Pushkar Lake on Kartik Purnima.","story":[{"icon":"🪔","title":"The Lotus of Brahma","text":"When Brahma dropped the lotus to slay the demon Vajranabha, water sprang forth at three points. To perform a purifying yajna, he needed his consort Saraswati. When she was delayed, he married the cowherd girl Gayatri, causing Saraswati to curse that he would only be worshipped in Pushkar."},{"icon":"🐪","title"
