teaching that what sets will rise again, and requiring zero priests—the devotee (Vrati) connects directly with nature!","story":[{"icon":"☀️","title":"Karna & Draupadi Solar Penance","text":"Suryaputra Karna (son of Sun God Surya) was the first to perform this ritual, standing in the Ganga river for hours to distribute wealth to the poor. Later, during the Pandavas exile, Draupadi performed Chhath to overcome insurmountable hardships and reclaim their kingdom."},{"icon":"🌊","title":"36 Hours of Nirjala Fasting","text":"Devotees undergo a grueling 36-hour waterless fast across 4 days: Nahay Khay (ritual cleansing), Kharna (evening kheer prasad), Sandhya Arghya (waist-deep river offering to the setting sun), and Usha Arghya (offering cow milk and water to the rising sun)."}],"vids":[{"title":"Chhath Puja: The Ultimate Festival of Faith and Solar Science","ytId":"6rB9yL8q7Vk","channel":"Doordarshan Heritage","desc":"Follow the 4-day austere journey of millions standing in holy rivers offering bamboo soop prasad to the cosmic Sun."}],"food":[{"e":"🍪","name":"Thekua","desc":"Crispy deep-fried sweet cookies made from whole wheat flour, dark sugarcane jaggery, cardamom, and dry coconut pressed on wooden carved dies."},{"e":"🥣","name":"Rasiya Kheer","desc":"Slow-cooked whole-grain rice pudding sweetened with raw jaggery and cow milk, eaten on Kharna evening."}],"rituals":[{"icon":"🌅","title":"Sandhya & Usha Arghya","desc":"Standing waist-deep in water holding a bamboo basket (soop) loaded with seasonal fruits to salute the sun."}],"q":[["What unique custom makes Chhath Puja distinct from all other solar rituals?","🌅","Worshipping the setting sun before the rising sun|No prayers are spoken|It is held in darkness|Only kings could participate","Chhath honors both dusk and dawn, showing reverence for the setting sun as the foundation of renewal."]],"g1":{"name":"Surya Arghya Waist-Deep River Tap","ty":"tap","e":"🌅","d":"Offer sacred milk and river water to the setting and rising sun!","sec":25,"tgt":"🌅","decoy":"🌊"},"g2":{"name":"Thekua & Bamboo Soop Pairs","ty":"mem","e":"🌾","d":"Match the carved wooden dies, sugarcane stalks, and diyas","sec":35,"pairs":["🌅","🌾","🪔","🍪","🥭","☀️"]}},{"id":"lathmar","name":"Lathmar Holi","e":"🎨","state":"Uttar Pradesh","tag":"Barsana & Nandgaon: Women Defend with Sticks in Radha-Krishna Lore","c1":"#db2777","c2":"#ca8a04","place":"Barsana & Nandgaon, Braj, UP","hint":"lathmar, barsana, nandgaon, radha krishna","fl":["🎨","🛡️","⚡","🌸","✨"],"didYouKnow":"Did you know? In Barsana (Radha village), women playfully beat men from Nandgaon (Krishna village) with long wooden staffs (lathis) while the men protect their heads with heavy leather shields! It is a joyful, centuries-old celebration of female empowerment and Krishna playful antics.","story":[{"icon":"🦚","title":"Krishna Prank in Barsana","text":"Legend says Lord Krishna from Nandgaon traveled to Barsana to playfully tease Radha and her friends with colors. Offended by his mischief, Radha and the Gopis chased Krishna and his cowherd companions out of the village with wooden sticks."},{"icon":"🛡️","title":"The Shield and Stick Duel","text":"Every year, men from Nandgaon arrive singing cheeky folk songs in Braj bhasha. The women of Barsana greet them in colorful veils, landing rhythmic blows with polished lathis while men crouch beneath shields amid showers of herbal Gulal and flower petals."}],"vids":[{"title":"Lathmar Holi: The Wildest & Most Joyful Holi on Earth","ytId":"l8M3v4N1q2w","channel":"National Geographic India","desc":"Experience the exhilarating tradition of Barsana women playfully striking shields with wooden lathis in Braj."}],"food":[{"e":"🥟","name":"Mawa Gujiya","desc":"Crisp golden crescent pastries stuffed with sweetened mawa (khoya), pistachios, almonds, and green cardamom."},{"e":"🥛","name":"Braj Thandai","desc":"Refreshing chilled milk infused with ground almonds, fennel seeds, watermelon seeds, rose petals, and black pepper."}],"rituals":[{"icon":"🛡️","title":"Dhal and Lathi Play","desc":"Men defending themselves with shields while women strike with rhythmic energy to traditional chants."}],"q":[["Which village women playfully beat the visiting men with sticks during Lathmar Holi?","🎨","Barsana (Radha village)|Vrindavan|Mathura|Ayodhya","The women of Barsana playfully strike the men visiting from Krishna village of Nandgaon."]],"g1":{"name":"Barsana Shield Deflection","ty":"tap","e":"🛡️","d":"Crouch beneath your leather shield to parry incoming lathis!","sec":20,"tgt":"🛡️","decoy":"💧"},"g2":{"name":"Radha Krishna Gulal Duel","ty":"mem","e":"🎨","d":"Match vibrant herbal powders, crescent gujiyas, and thandai","sec":30,"pairs":["🎨","🛡️","⚡","🌸","✨","🥟"]}},{"id":"devdeepawali","name":"Dev Deepawali","e":"🪔","state":"Uttar Pradesh","tag":"Varanasi: One Million Earthen Lamps When the Gods Descend to Earth","c1":"#b45309","c2":"#7c2d12","place":"Ghats of Varanasi, Uttar Pradesh","hint":"dev deepawali, varanasi, ganga ghats, tripurasura","fl":["🪔","🌊","🛕","✨","🌕"],"didYouKnow":"Did you know? Celebrated exactly 15 days after Diwali on Kartik Purnima, Dev Deepawali commemorates Lord Shiva slaying the demon Tripurasura. Believing that all 330 million gods descend from heaven to take a sacred bath in the Ganga, the people of Kashi light over ONE MILLION oil lamps across all 84 ghats!","story":[{"icon":"🔱","title":"The Victory Over Tripurasura","text":"The demon Tripurasura conquered the three realms with three flying iron, silver, and gold cities. Lord Shiva mounted a chariot made of the earth, using Mount Meru as his bow and Lord Vishnu as his arrow, destroying all three cities with a single fiery arrow on Kartik Purnima."},{"icon":"🌊","title":"The Golden Crescent of Kashi","text":"From Assi Ghat to Rajghat, millions of terracotta diyas create a continuous glowing ribbon of fire reflected in the holy river. Massive laser light shows and the Maha Aarti at Dashashwamedh Ghat make it an unforgettable sensory spectacle."}],"vids":[{"title":"Dev Deepawali in Varanasi: One Million Lamps on the Ganga","ytId":"d9M1v7N4q2w","channel":"Incredible India Culture","desc":"Watch the entire 4-mile crescent of Varanasi ghats ignite in a sea of oil lamps as Vedic hymns echo across the waters."}],"food":[{"e":"🥛","name":"Malaiyyo (Makhan Malai)","desc":"Varanasi winter cloud-like saffron milk foam flavored with pistachios and served in earthen kulhads."},{"e":"🥟","name":"Banarasi Kachori Jalebi","desc":"Flaky lentil-stuffed kachoris served with spicy aloo sabzi and hot syrupy jalebis."}],"rituals":[{"icon":"🪔","title":"Deepdaan on the Ganga","desc":"Releasing small floating leaf boats containing lit oil lamps and marigold blossoms into the river current."}],"q":[["Why is Dev Deepawali celebrated 15 days after Diwali in Varanasi?","🪔","To celebrate Shiva victory over Tripurasura and the gods descent to earth|To celebrate the monsoon|To harvest wheat|To elect village leaders","It celebrates Tripurari Shiva triumph and the divine descent of gods to bathe in the holy Ganga."]],"g1":{"name":"1 Million Diyas Lighting Relay","ty":"tap","e":"🪔","d":"Ignite the infinite string of oil lamps along the Kashi riverfront!","sec":25,"tgt":"🪔","decoy":"💨"},"g2":{"name":"Ganga Ghats Tripurari Victory","ty":"mem","e":"🌊","d":"Match the fiery arrows, brass aarti cauldrons, and bells","sec":35,"pairs":["🪔","🌊","🛕","✨","🌕","🔱"]}},{"id":"rajaparba","name":"Raja Parba","e":"🌸","state":"Odisha","tag":"The 3-Day Holiday for Mother Earth & The Rajo Doli Floral Swings","c1":"#db2777","c2":"#16a34a","place":"Across Odisha","hint":"raja parba, poda pitha, mother earth, rajo doli","fl":["🌸","🍃","🍯","🎪","✨"],"didYouKnow":"Did you know? Raja Parba is perhaps the ONLY festival on planet Earth that celebrates the biological womanhood and menstruation of Mother Earth (Bhumi Devi)! For three full days, all agricultural activity, plowing, digging, and cutting of trees is strictly suspended so the Earth can rest peacefully before the monsoon rains!","story":[{"icon":"🍃","title":"Mother Earth Rest Period","text":"In Odia culture, the onset of monsoon signifies the fertile rejuvenation of Mother Earth. Just as women rest during their cycles, the soil is given three days of total rest. Girls are pampered, relieved of all household chores, wear new clothes, and celebrate womanhood."},{"icon":"🎪","title":"Rajo Doli & Poda Pitha","text":"Vibrant tree swings (Rajo Doli) decorated with wild flowers and mango leaves are hung from banyan and neem trees. Young women sing melodious \"Rajo Geeta\" folk songs while swinging high and sharing the slow-baked delicacy Poda Pitha."}],"vids":[{"title":"Raja Parba: The Festival Celebrating Mother Earth & Womanhood","ytId":"o8M3v1N7q4w","channel":"Doordarshan Odisha","desc":"Discover Odisha unique tradition where the earth is allowed to rest, girls swing on flower boughs, and Poda Pitha is baked."}],"food":[{"e":"🥧","name":"Poda Pitha","desc":"Traditional slow-baked earthen cake made of fermented rice, black gram, coconut chips, jaggery, and crushed black pepper wrapped in banana leaves."}],"rituals":[{"icon":"🎪","title":"Rajo Doli Swinging","desc":"Swinging on ornate floral rope swings suspended from ancient village trees without letting feet touch bare ground."}],"q":[["What profound ecological message does Raja Parba teach humankind?","🍃","Giving Mother Earth three days of rest without tilling or cutting trees|Cutting trees for fuel|Continuous non-stop farming|Drying up rivers","It teaches deep ecological reverence by banning digging, plowing, and tree-cutting so the soil rests before monsoon."]],"g1":{"name":"Rajo Doli Forest Swing","ty":"tap","e":"🎪","d":"Soar high on the floral swings without feet touching bare earth!","sec":25,"tgt":"🎪","decoy":"🍂"},"g2":{"name":"Mother Earth Poda Pitha Feast","ty":"mem","e":"🌸","d":"Match banana leaf wrapped cakes, neem buds, and mango boughs","sec":30,"pairs":["🌸","🍃","🍯","🎪","✨","🥧"]}},{"id":"rathyatra","name":"Puri Rath Yatra","e":"🛕","state":"Odisha","tag":"Lord Jagannath Chariot Journey: Where the Divine Steps Out for All","c1":"#e11d48","c2":"#f59e0b","place":"Puri, Odisha","hint":"puri, rath yatra, jagannath, chariots, chhera pahara","fl":["🛕","🚩","🪵","🥁","✨"],"didYouKnow":"Did you know? The English word \"Juggernaut\" (an unstoppable massive force) originated directly from \"Jagannath\" and his mammoth 45-foot-tall wooden chariots! In the unique ritual of \"Chhera Pahara\", the King of Puri sweeps the chariot floor with a golden broom, proving that before the Lord of the Universe, a king and a commoner are completely equal!","story":[{"icon":"🛕","title":"The Lord Who Steps Outside the Temple","text":"In most Hindu temples, deities remain inside the sanctum. But once a year, Lord Jagannath, his brother Balabhadra, and sister Subhadra emerge from the Puri temple so that all human beings—regardless of caste, nationality, or creed—can behold and touch their chariots."},{"icon":"🪵","title":"Chariots Built Anew Every Year","text":"The three gigantic wooden chariots (Nandighosha, Taladhwaja, and Darpadalana) are constructed from scratch every single year using 1,000+ logs of specific wood trees, without using a single steel nail or bolt, following centuries-old oral architectural manuals."}],"vids":[{"title":"Puri Rath Yatra: The World Largest Chariot Festival","ytId":"r9M2v4N6q1w","channel":"National Geographic Heritage","desc":"Follow the millions pulling the 16-wheeled wooden chariot of Lord Jagannath along Puri Grand Road (Bada Danda)."}],"food":[{"e":"🍬","name":"Puri Khaja & Mahaprasad","desc":"Multi-layered crispy wheat pastry glazed in sugar syrup, offered at the 56-dish Ananda Bazar of the Jagannath Temple."}],"rituals":[{"icon":"🧹","title":"Chhera Pahara","desc":"The titular Gajapati King of Puri humbly sweeping the chariot platform with a broom made of pure gold."}],"q":[["Which English word meaning an irresistible massive force originates from Lord Jagannath?","🛕","Juggernaut|Colossus|Titan|Behemoth","The word Juggernaut entered the English dictionary from British observers describing the colossal chariots of Jagannath."]],"g1":{"name":"Bada Danda Chariot Pullers","ty":"tap","e":"🛕","d":"Pull the giant 16-wheeled Nandighosha chariot with millions!","sec":25,"tgt":"🛕","decoy":"🪨"},"g2":{"name":"Lord Jagannath Golden Broom","ty":"mem","e":"🚩","d":"Match the royal broom, wooden eyes, and sweet Khaja pastries","sec":35,"pairs":["🛕","🚩","🪵","🥁","✨","🧹"]}},{"id":"bathukamma","name":"Bathukamma","e":"🌺","state":"Telangana","tag":"The 9-Day Floral Festival of Goddess Gauri & Nature Healing Flora","c1":"#be185d","c2":"#16a34a","place":"Across Telangana","hint":"bathukamma, gunugu, tangedu, gopuram, gauri","fl":["🌺","🌼","🪔","💃","✨"],"didYouKnow":"Did you know? Bathukamma is built entirely using wild medicinal flowers like Gunugu (Celosia) and Tangedu (Cassia auriculata) which naturally purify water! When hundreds of thousands of floral Bathukammas are immersed in village ponds and lakes on the 9th day, the flowers cleanse the water bodies after the monsoon!","story":[{"icon":"🌺","title":"The Legend of Alive Mother (Bathukamma)","text":"Bathukamma literally means \"Mother Goddess, Come Alive!\". Legend tells of King Dharmangada who prayed to Goddess Lakshmi after losing a hundred sons in battle. The Goddess was born as his daughter. When she survived near-death trials, sages blessed her with the name Bathukamma."},{"icon":"💃","title":"The Seven-Layer Floral Pyramid","text":"Women skillfully arrange concentric layers of seasonal wildflowers onto a brass plate (Taambalam) shaped like a temple gopuram, topped with a turmeric idol of Gouramma. In the evening, women in festive sarees clap and sing lilting folk ballads circling the floral towers."}],"vids":[{"title":"Bathukamma: The Vibrant Floral Symphony of Telangana","ytId":"b7M4v1N9q2w","channel":"Telangana Tourism Official","desc":"Watch thousands of women gathering at sunset at Hussain Sagar lake, singing folk songs around illuminated flower towers."}],"food":[{"e":"🍬","name":"Maleeda & Saddulu","desc":"Nutritious sweet laddus made of crushed jowar/wheat rotis with jaggery and ghee, alongside 5 varieties of seasoned rice."}],"rituals":[{"icon":"🌺","title":"Saddula Bathukamma Immersion","desc":"Gently floating the flower mounds into lakes at dusk, allowing the herbal petals to purify the water ecosystem."}],"q":[["What does the word \"Bathukamma\" literally translate to in Telugu?","🌺","Mother Goddess, Come Alive!|Flower Garden|Spring Season|Queen of Flowers","Bathukamma translates to \"Come Alive, Mother Goddess\", celebrating feminine resilience and nature."]],"g1":{"name":"Seven-Layer Floral Gopuram","ty":"tap","e":"🌺","d":"Stack Gunugu and Tangedu wildflowers into towering pyramids!","sec":25,"tgt":"🌺","decoy":"🍂"},"g2":{"name":"Gouramma Water Blessing","ty":"mem","e":"💃","d":"Match the turmeric cones, lake ripples, and silk potli bags","sec":30,"pairs":["🌺","🌼","🪔","💃","✨","🍬"]}},{"id":"medaram","name":"Medaram Jathara (Sammakka Saralamma)","e":"🐅","state":"Telangana","tag":"Asia Largest Tribal Pilgrimage: The Heroic Mother & Daughter Warriors","c1":"#b45309","c2":"#991b1b","place":"Medaram, Mulugu, Telangana","hint":"medaram, sammakka, saralamma, jathara, tribal","fl":["🐅","🪵","🍯","🚩","✨"],"didYouKnow":"Did you know? Medaram Jathara is the LARGEST tribal gathering in the world, with over 10 to 12 million pilgrims congregating in the dense Dandakaranya forests! Instead of gold or money, devotees offer \"Bangaram\" which is pure jaggery equal to their own body weight (Thulabharam) to honor tribal mother Sammakka and daughter Saralamma who fought against unjust Kakatiya taxes!","story":[{"icon":"⚔️","title":"The Rebellion Against Tyranny","text":"In the 13th century, severe drought struck the tribal Koya realm. When the Kakatiya rulers demanded heavy taxes from starving tribals, chieftain Pagididda Raju, his wife Sammakka, and daughter Saralamma valiantly fought the royal army on the banks of Jampanna Vagu to protect their people."},{"icon":"🐅","title":"The Sacred Vermilion Casket","text":"Mortally wounded, Sammakka walked into the Chilakalagutta forest. Her grief-stricken people searched for her and found only a pugmark of a tigress and a golden casket of vermilion (Kumkuma Bharani). That casket is brought down biennially by tribal priests to bless millions."}],"vids":[{"title":"Medaram Jathara: The 10 Million Strong Tribal Gathering","ytId":"m8M2v1N4q7w","channel":"National Geographic India","desc":"Explore the staggering scale of Asia largest tribal pilgrimage deep in the forests of Telangana."}],"food":[{"e":"🍯","name":"Bangaram (Jaggery Prasad)","desc":"Blocks of raw sugarcane jaggery weighed against one body weight and distributed to thousands of pilgrims."}],"rituals":[{"icon":"⚖️","title":"Thulabharam with Jaggery","desc":"Devotees sitting on giant weighing scales, balancing their exact body weight in sweet jaggery as an offering."}],"q":[["What is the sacred offering \"Bangaram\" made of at the Medaram Jathara?","🍯","Pure Jaggery|Actual Gold Coins|Silver Ornaments|Honey","Devotees offer raw jaggery equal to their body weight, affectionately calling it \"Bangaram\" (Gold)."]],"g1":{"name":"Bangaram Jaggery Thulabharam","ty":"tap","e":"🍯","d":"Balance the sacred jaggery offering equal to your body weight!","sec":25,"tgt":"🍯","decoy":"🪵"},"g2":{"name":"Sammakka Tigress Pugmark Lore","ty":"mem","e":"🐅","d":"Match the golden kumkum caskets, forest spears, and drums","sec":35,"pairs":["🐅","🪵","🍯","🚩","✨","⚔️"]}},{"id":"bihu","name":"Rongali Bihu","e":"🍃","state":"Assam","tag":"The Rhythm of the Dhol, Pepa Flutes, and the Assamese New Year","c1":"#15803d","c2":"#dc2626","place":"Across Assam","hint":"bihu, rongali, dhol, pepa, gamosa","fl":["🍃","🎺","🥁","🌸","✨"],"didYouKnow":"Did you know? The distinctive curved wind instrument played during Bihu, the \"Pepa\", is handcrafted from the horn of a dead domestic water buffalo! The festival also centers on the \"Gamosa\"—the handwoven red-and-white towel of respect presented to elders, guests, and loved ones as the ultimate symbol of Assamese warmth!","story":[{"icon":"🍃","title":"The Three Bihus of the Year","text":"Assam observes 3 seasonal Bihus: Rongali/Bohag Bihu (April: rejoicing spring and sowing), Kongali/Kati Bihu (October: lighting earthen lamps by paddy fields to protect saplings), and Bhogali/Magh Bihu (January: harvest feast around giant bamboo bonfires called Meji)."},{"icon":"💃","title":"The Hypnotic Bihu Dance","text":"Young men and women wear traditional golden Muga silk mekhela chadors and kopou orchids in their hair, dancing with rapid hand movements and rhythmic swaying hips to the beats of the Dhol, Pepa, and bamboo clapper (Toka)."}],"vids":[{"title":"Rongali Bihu: The Soul & Spirit of Assam","ytId":"b7M2v4N8q1w","channel":"Incredible India Heritage","desc":"Experience the electric energy of Bihu dancers, the resonant sound of the buffalo horn Pepa, and Assamese hospitality."}],"food":[{"e":"🥞","name":"Til Pitha & Ghila Pitha","desc":"Crispy rolled rice crepes stuffed with toasted black sesame and jaggery, and fried sticky-rice cakes."},{"e":"🥣","name":"Jolpan with Doi and Gur","desc":"Assamese breakfast of puffed rice (Muri), flattened rice (Chira), and Bora sticky rice with curd and date-palm jaggery."}],"rituals":[{"icon":"🧣","title":"Gamosa Gifting","desc":"Presenting hand-woven cotton Gamosas with red floral motifs to elders to seek blessings for the new year."}],"q":[["What horn is traditionally used to handcraft the Assamese musical instrument \"Pepa\"?","🎺","Water Buffalo Horn|Rhino Horn|Deer Antler|Cow Horn","The Pepa is crafted from the hollowed horn of a domestic water buffalo with a bamboo reed."]],"g1":{"name":"Bihu Dhol & Pepa Rhythm","ty":"rhy","e":"🎺","d":"Blow the buffalo-horn Pepa in sync with the rapid Dhol rhythm!","sec":30,"lanes":["🍃","🎺","🥁","🌸"]},"g2":{"name":"Gamosa & Muga Silk Weaves","ty":"mem","e":"🍃","d":"Match the red floral towels, Kopou orchids, and sweet Til Pitha","sec":35,"pairs":["🍃","🎺","🥁","🌸","✨","🥞"]}},{"id":"hornbill","name":"Hornbill Festival","e":"🪶","state":"Nagaland","tag":"The Festival of Festivals: Uniting 17 Indigenous Naga Warrior Tribes","c1":"#b91c1c","c2":"#0284c7","place":"Kisama Heritage Village, Kohima, Nagaland","hint":"hornbill, naga tribes, log drums, kisama","fl":["🪶","🪵","🔥","🗡️","✨"],"didYouKnow":"Did you know? Named after the revered Indian Great Hornbill bird whose feathers once adorned warrior headgear, the Hornbill Festival unites all 17 recognized tribes of Nagaland under one roof! Each tribe maintains its own authentic thatched Morung (traditional bachelor dormitory) in Kisama, showcasing unique tribal dialects, war chants, and woodcraft!","story":[{"icon":"🪶","title":"Reviving Naga Cultural Sovereignty","text":"Historically, Naga tribes celebrated their individual agricultural festivals separately. Initiated in the year 2000, the Hornbill Festival created a grand platform of unity, preserving ancient oral songs, weaving patterns, and indigenous sports from fading into history."},{"icon":"🪵","title":"Thunderous Log Drum Beats","text":"Naga warriors carve massive communal hollow log drums out of entire tree trunks. Groups of 30 warriors line both sides, beating rhythmic syncopated cadences with heavy wooden mallets that echo across the rolling hills of Kohima."}],"vids":[{"title":"Hornbill Festival: Inside the Land of Naga Warriors","ytId":"h8M4v1N7q2w","channel":"National Geographic Documentary","desc":"Explore the vibrant morungs, war cries, traditional archery, and Naga fire dances in Kisama."}],"food":[{"e":"🌶️","name":"Smoked Bamboo Shoot & Raja Mircha Stew","desc":"Traditional tribal stew cooked with fermented bamboo shoots, local herbs, and the world fiery Bhut Jolokia (Ghost Pepper)."}],"rituals":[{"icon":"🪵","title":"Tribal Log Drumming","desc":"Beating massive carved hollow tree-trunk drums in synchronized cadence to signal community celebrations."}],"q":[["How many indigenous Naga tribes unite to celebrate the Hornbill Festival in Kisama?","🪶","17 Tribes|3 Tribes|50 Tribes|Only 1 Tribe","All 17 recognized Naga tribes come together in Kisama to celebrate their heritage."]],"g1":{"name":"Naga Log Drum Cadence","ty":"rhy","e":"🪵","d":"Beat the giant hollowed tree-trunk drums in warrior cadence!","sec":30,"lanes":["🪶","🪵","🔥","🗡️"]},"g2":{"name":"17 Tribes Morung Heritage","ty":"mem","e":"🪶","d":"Match hornbill feathers, woven shawls, and bamboo spears","sec":35,"pairs":["🪶","🪵","🔥","🗡️","✨","🌶️"]}},{"id":"wangala","name":"Wangala (100-Drums Festival)","e":"🥁","state":"Meghalaya","tag":"The Garo Tribe 100-Drums Harvest Festival for Sun God Saljong","c1":"#b45309","c2":"#15803d","place":"Asanang, Tura, Garo Hills, Meghalaya","hint":"wangala, 100 drums, garo, saljong, harvest","fl":["🥁","🌾","🪶","⚡","✨"],"didYouKnow":"Did you know? Wangala is known as the \"100-Drums Festival\" because exactly 100 long, cylindrical wooden drums (Dama) are played simultaneously by 100 young men! Women in traditional colorful Dakmanda wraps dance in synchronized parallel lines, imitating nature, birds, and swaying crops!","story":[{"icon":"☀️","title":"Thanksgiving to Saljong (Sun God)","text":"The Garo people are an indigenous matrilineal community. Wangala marks the end of agricultural labor in the jhum fields. Before enjoying the winter harvest, the village chief (Nokma) offers the first fruits to Sun God Saljong, the giver of fertility and light."},{"icon":"🥁","title":"The Ground-Shaking Rhythm","text":"Men in feathered turbans (Kotip) beat two-foot-long wooden drums suspended from their necks. As the beat intensifies, the earth literally vibrates beneath the footsteps of hundreds of synchronized dancers."}],"vids":[{"title":"Wangala: The 100 Drums Festival of the Garo People","ytId":"w7M2v4N9q1w","channel":"Doordarshan North East","desc":"Experience the thunderous rhythm of 100 drums beating in unison and the graceful Garo harvest dances in the hills of Meghalaya."}],"food":[{"e":"🍚","name":"Minil Sticky Rice & Nakham Bitchi","desc":"Fragrant steamed red sticky rice served with dry fish soup flavored with fiery local chillies and wild mountain herbs."}],"rituals":[{"icon":"🌾","title":"Rugala Ceremony","desc":"The village Nokma offering freshly brewed rice beer and cooked rice over sacred burning stones."}],"q":[["Which indigenous tribe of Meghalaya celebrates the 100-Drums Wangala festival?","🥁","The Garo Tribe|The Khasi Tribe|The Jaintia Tribe|The Mizo Tribe","Wangala is the most prominent post-harvest cultural festival of the Garo people."]],"g1":{"name":"100-Drums Synchronized Symphony","ty":"rhy","e":"🥁","d":"Play the long cylindrical wood drums in perfect cadence!","sec":30,"lanes":["🥁","🌾","🪶","⚡"]},"g2":{"name":"Garo Sun God Saljong Match","ty":"mem","e":"🌾","d":"Match feathered Kotip caps, rice beer pots, and bamboo shoots","sec":35,"pairs":["🥁","🌾","🪶","⚡","✨","🍚"]}},{"id":"shigmo","name":"Shigmo","e":"🎭","state":"Goa","tag":"The Konkani Spring Carnival & The Ghode Modni Warrior Horse Dance","c1":"#ea580c","c2":"#7c3aed","place":"Panaji, Ponda & Across Goa","hint":"shigmo, ghode modni, dhangar, konkani, carnival","fl":["🎭","🐎","🥁","🌺","✨"],"didYouKnow":"Did you know? While Goa is internationally famous for its Western Portuguese Carnival, \"Shigmo\" is the authentic ancient indigenous Hindu Konkani spring festival! It features \"Ghode Modni\" where dancers buckle wooden dummy horses around their waists with unsheathed swords, celebrating the historic return of Maratha warrior troops!","story":[{"icon":"🐎","title":"Welcoming the Victorious Warriors","text":"In ancient Goa, warriors who departed to fight invaders after Dussehra returned home in spring. Shigmo was celebrated by village folk to welcome their heroes back with gulal, flower garlands, and martial dances."},{"icon":"🥁","title":"Romat & Fugdi Folk Extravaganza","text":"Massive temple floats illustrating scenes from the Ramayana and Mahabharata glide through the capital Panaji, accompanied by Dhol-Tasha beats and graceful women dancing the traditional Fugdi."}],"vids":[{"title":"Goa Shigmo: The Real Indigenous Spring Festival","ytId":"s7M1v4N9q2w","channel":"Goa Tourism Official","desc":"Witness the dazzling Ghode Modni warrior horse dancers, Konkani folklore floats, and vibrant colors of Shigmo."}],"food":[{"e":"🍛","name":"Goan Khatkhate","desc":"A rich exotic Goan vegetable stew cooked with 21 local vegetables, grated coconut, and fragrant Tirphal berries."}],"rituals":[{"icon":"🐎","title":"Ghode Modni","desc":"Performing equestrian martial dance moves while strapped into elaborate wooden hobby horses with drawn swords."}],"q":[["What is the traditional warrior horse dance performed during Shigmo called?","🐎","Ghode Modni|Kathakali|Garba|Bhangra","Ghode Modni (Horse Dance) commemorates the victorious homecoming of ancient Goan warriors."]],"g1":{"name":"Ghode Modni Warrior Horse Dance","ty":"tap","e":"🐎","d":"Perform the martial dummy-horse gallop with unsheathed swords!","sec":20,"tgt":"🐎","decoy":"🛑"},"g2":{"name":"Konkani Spring Float Carnival","ty":"mem","e":"🎭","d":"Match mythological floats, brass cymbals, and Fugdi dancers","sec":30,"pairs":["🎭","🐎","🥁","🌺","✨","🍛"]}},{"id":"bonderam","name":"Bonderam Festival","e":"🚩","state":"Goa","tag":"Divar Island: The Historic Flag Festival and Mock Bamboo Battles","c1":"#0284c7","c2":"#f59e0b","place":"Divar Island, Mandovi River, Goa","hint":"bonderam, divar island, flags, fotashes, mock battle","fl":["🚩","🎺","🏝️","🎉","✨"],"didYouKnow":"Did you know? \"Bonderam\" originates from the Portuguese word \"Bandeira\" (flag). During the Portuguese colonial era, rival village sections in Divar Island constantly disputed property boundaries. The Portuguese posted flags to demarcate borders, which the villagers shot down with bamboo popguns (Fotashes)! Today, it is celebrated as a colorful mock battle and island carnival!","story":[{"icon":"🚩","title":"The Historic Boundary Disputes","text":"The four wards of Divar Island (Piedade, Malar, Goltim, Navelim) had bitter boundary skirmishes. The Portuguese rulers installed national flags on boundary stones. The rebellious islanders knocked the flags down using hollow bamboo popguns with wild berries as ammunition."},{"icon":"🎺","title":"Island Carnival Parade","text":"On the 4th Saturday of August, the quaint ferry-connected island comes alive with brass bands, float parades representing traditional bakeries, fishermen, and Portuguese heritage, culminating in friendly flag processions."}],"vids":[{"title":"Bonderam: Divar Island Quaint Flag Carnival","ytId":"b8M2v1N7q4w","channel":"Incredible India Experiences","desc":"Hop onto the ferry to Divar Island to experience the mock flag battles, Portuguese-era brass bands, and Goan warmth."}],"food":[{"e":"🥮","name":"Bebinca & Patoleo","desc":"Traditional 7-layered Goan coconut milk pudding and turmeric leaf steamed rice cakes with jaggery filling."}],"rituals":[{"icon":"🚩","title":"Flag March","desc":"Carrying colorful silk flags through island pathways accompanied by energetic brass trumpets and accordions."}],"q":[["On which picturesque island in Goa is the Bonderam Flag Festival celebrated?","🚩","Divar Island|Chorão Island|St. Jacinto Island|Grand Island","Bonderam is celebrated exclusively on Divar Island on the Mandovi River."]],"g1":{"name":"Fotashes Bamboo Popgun Flag Knock","ty":"tap","e":"🚩","d":"Aim the bamboo popgun to knock down the disputed boundary flags!","sec":20,"tgt":"🚩","decoy":"🥥"},"g2":{"name":"Divar Island Portuguese Lore","ty":"mem","e":"🏝️","d":"Match island ferries, brass horns, layered bebinca, and flags","sec":30,"pairs":["🚩","🎺","🏝️","🎉","✨","🥮"]}},{"id":"hemis","name":"Hemis Tsechu","e":"👹","state":"Himachal Pradesh","tag":"Ladakh: The Sacred Cham Masked Dances of Guru Padmasambhava","c1":"#b91c1c","c2":"#d97706","place":"Hemis Monastery, Ladakh (12,000 ft)","hint":"hemis, ladakh, cham dance, padmasambhava, monastery","fl":["👹","🎺","🏔️","🛕","✨"],"didYouKnow":"Did you know? Hemis Tsechu celebrates the birth anniversary of Guru Padmasambhava (Guru Rinpoche), who introduced Tantric Buddhism to the Himalayas! The Buddhist lamas wear intricate, sacred papier-mâché masks and heavy silk brocade robes, performing the \"Cham\" dance to banish malevolent spirits and purify the world!","story":[{"icon":"🛕","title":"The Ancient 300-Year-Old Monastery","text":"Perched in a rocky gorge 45 km from Leh, Hemis is Ladakh wealthiest and largest monastery. The courtyard echoes with deep resonant Tibetan horns (Dungchen), cymbals, and drums as monks enact the triumph of compassion over destructive ego."},{"icon":"📜","title":"The Giant 4-Story Thangka Unfurling","text":"Once every 12 years (in the Year of the Monkey), the colossal silk-embroidered Thangka (tapestry) of Guru Padmasambhava—spanning four stories high—is ceremoniously unfurled down the monastery facade, drawing pilgrims from across the globe."}],"vids":[{"title":"Hemis Festival: Inside Ladakh Sacred Masked Dance","ytId":"h9M1v4N8q2w","channel":"Discovery Asia Cultural Heritage","desc":"Experience the mystical Cham masked dances, long Tibetan horn blasts, and ancient Buddhist rituals at 12,000 feet in Ladakh."}],"food":[{"e":"🥟","name":"Ladakhi Tingmo & Thukpa","desc":"Steamed fluffy twisted flower buns served with hearty hot noodle soup with mountain herbs."},{"e":"☕","name":"Butter Tea (Gur Gur Chai)","desc":"Warm comforting tea churned with yak butter and Himalayan rock salt."}],"rituals":[{"icon":"👹","title":"Cham Dance","desc":"Monks performing slow, hypnotic ritual dances in terrifying and peaceful deity masks to purify the mind."}],"q":[["Who is honored and celebrated during the Hemis Tsechu festival in Ladakh?","👹","Guru Padmasambhava (Guru Rinpoche)|Ashoka|Dalai Lama I|Kanishka","The festival commemorates the birth anniversary of Guru Padmasambhava, the patron saint of Tibetan Buddhism."]],"g1":{"name":"Monastic Cham Masked Dance","ty":"rhy","e":"👹","d":"Sound the long Dungchen horns and follow the sacred Cham rhythm!","sec":30,"lanes":["👹","🎺","🏔️","🛕"]},"g2":{"name":"Guru Padmasambhava Himalayan Lore","ty":"mem","e":"🏔️","d":"Match butter tea churns, silk thangkas, and prayer wheels","sec":35,"pairs":["👹","🎺","🏔️","🛕","✨","🥟"]}},{"id":"kullu","name":"Kullu Dussehra","e":"🏔️","state":"Himachal Pradesh","tag":"Valley of the Gods: Where Dussehra Begins When It Ends Elsewhere","c1":"#b45309","c2":"#047857","place":"Dhalpur Maidan, Kullu, Himachal Pradesh","hint":"kullu dussehra, 200 deities, raghunath, valley of gods","fl":["🏔️","🛕","🎺","👑","✨"],"didYouKnow":"Did you know? Unlike everywhere else in India where Dussehra ends on Vijayadashami, Kullu Dussehra BEGINS on that day and lasts for an entire week! Over 200 local mountain village village deities (Devtas) arrive in ornate wooden palanquins carried across mountain passes to pay homage to Lord Raghunath!","story":[{"icon":"👑","title":"Raja Jagat Singh Penance (1660)","text":"Raja Jagat Singh of Kullu mistakenly caused the death of a pious Brahmin. Stricken with guilt and illness, he abdicated his throne and dedicated his kingdom to Lord Rama (Raghunath), declaring that the Lord alone was the king of Kullu. Today, the raja still acts as a humble servant."},{"icon":"🛕","title":"The Divine Congregation of Deities","text":"At Dhalpur Maidan, 200 colorful deity palanquins with silver masks and silk streamers communicate through traditional shamans (Gurs), blessing thousands of mountain villagers who sing and dance to Nati folk music."}],"vids":[{"title":"Kullu Dussehra: The Great Gathering of 200 Mountain Gods","ytId":"k7M3v1N4q9w","channel":"Doordarshan Himachal","desc":"Watch hundreds of village deities carried on palanquins across the Himalayas to gather at Dhalpur Maidan in Kullu."}],"food":[{"e":"🥟","name":"Himachali Siddu","desc":"Steamed fermented wheat bread stuffed with spiced crushed walnuts, poppy seeds, and served with pure cow ghee."},{"e":"🍲","name":"Kullu Dham","desc":"Traditional festive meal cooked by hereditary boti chefs in copper vessels: madra, telia mash, and sweet mittha."}],"rituals":[{"icon":"🛕","title":"Rath Yatra of Raghunath","desc":"Pulling the colossal wooden chariot of Lord Raghunath through Dhalpur Maidan by thousands of barefoot pilgrims."}],"q":[["How does the timing of Kullu Dussehra differ uniquely from the rest of India?","🏔️","It begins on Vijayadashami when Dussehra ends elsewhere|It is celebrated only at night|It is held in the peak of summer|It lasts for only one hour","Kullu Dussehra begins on Vijayadashami day and continues for an entire week of festivities."]],"g1":{"name":"200 Mountain Deities Gathering","ty":"tap","e":"🏔️","d":"Carry the decorated devta palanquins into the sacred valley!","sec":25,"tgt":"🏔️","decoy":"🪨"},"g2":{"name":"Raghunath Divine Rath Yatra","ty":"mem","e":"🛕","d":"Match silver mask palanquins, walnut siddu, and Nati horns","sec":35,"pairs":["🏔️","🛕","🎺","👑","✨","🥟"]}},{"id":"bastar","name":"Bastar Dussehra","e":"🌲","state":"Chhattisgarh","tag":"The World Longest Festival (75 Days) Honoring Goddess Danteshwari","c1":"#b91c1c","c2":"#15803d","place":"Jagdalpur, Bastar, Chhattisgarh","hint":"bastar dussehra, 75 days, danteshwari, chariot, tribal","fl":["🌲","🪵","🛕","🔥","✨"],"didYouKnow":"Did you know? Bastar Dussehra is the LONGEST festival in the world, running for a staggering 75 days! Remarkably, it does NOT celebrate Lord Rama victory over Ravana; instead, it is an ancient tribal council festival honoring the indigenous mother goddess Danteshwari and democratic tribal unity!","story":[{"icon":"👑","title":"13th-Century Kakatiya Origins","text":"Founded by King Purushottam Dev of Bastar in the early 13th century after returning on foot from Puri with the title of \"Rathapati\", he instituted this festival where all tribal clans assemble to voice grievances and celebrate their community forest rights."},{"icon":"🪵","title":"The Massive 8-Wheeled Chariot","text":"Tribal artisans from the Saonra clan build a gigantic double-decked 8-wheeled wooden chariot without blueprints, nails, or saws. Over 10,000 Maria and Muria tribespeople pull the chariot using thick forest creepers with hypnotic rhythmic chants."}],"vids":[{"title":"Bastar Dussehra: The 75-Day Longest Festival on Earth","ytId":"b8M4v2N9q1w","channel":"Discovery Channel India","desc":"Discover the ancient 75-day tribal rituals, the construction of the massive nail-free wooden chariot, and the worship of Goddess Danteshwari."}],"food":[{"e":"🥞","name":"Angakar Roti & Mahua Ladoo","desc":"Rustic rice flour flatbread slow-roasted between sal leaves over wood fire, and sweet nutritious balls made from wild Mahua flowers."}],"rituals":[{"icon":"🪵","title":"Rath Parikrama","desc":"Pulling the colossal two-tiered wooden chariot through Jagdalpur using natural forest creepers."}],"q":[["How long does the world-record Bastar Dussehra festival last?","🌲","75 Days|10 Days|1 Month|3 Days","Bastar Dussehra is the longest festival on earth, spanning 75 days from Shravan to Ashwin."]],"g1":{"name":"Danteshwari Nail-Free Chariot Pull","ty":"tap","e":"🌲","d":"Pull the colossal 8-wheeled hand-hewn chariot with forest creepers!","sec":25,"tgt":"🌲","decoy":"🪨"},"g2":{"name":"75-Day Tribal Democracy Council","ty":"mem","e":"🪵","d":"Match sal tree boughs, brass bells, and mahua flowers","sec":35,"pairs":["🌲","🪵","🛕","🔥","✨","🥞"]}},{"id":"khajuraho","name":"Khajuraho Dance Festival","e":"🏛️","state":"Madhya Pradesh","tag":"India Premier Classical Dance Festival at 1,000-Year-Old UNESCO Temples","c1":"#b45309","c2":"#7c3aed","place":"Khajuraho, Chhatarpur, Madhya Pradesh","hint":"khajuraho, classical dance, kathak, bharatanatyam, chandela","fl":["🏛️","💃","🪔","✨","🌕"],"didYouKnow":"Did you know? The festival takes place outdoors right against the floodlit backdrop of the Western Group of Khajuraho Temples (built between 950 and 1050 AD by the Chandela dynasty). The intricate celestial apsaras and dancers carved in stone 1,000 years ago seem to literally come alive as real dancers perform beneath the starry sky!","story":[{"icon":"🏛️","title":"The Living Stone Heritage","text":"The Chandela rulers envisioned Khajuraho as an architectural celebration of life, human emotions, and spiritual transcendence. In 1975, the government established the dance festival to revive the ancient temple tradition of classical Natya."},{"icon":"💃","title":"India Master Dance Forms","text":"Over 7 magical evenings, the greatest exponents of Kathak, Bharatanatyam, Odissi, Kuchipudi, Kathakali, and Manipuri perform against the luminous Chitragupta and Vishwanatha stone temples."}],"vids":[{"title":"Khajuraho Dance Festival: Where Stone Sculptures Come Alive","ytId":"k9M1v7N4q2w","channel":"Incredible India Heritage","desc":"Witness India legendary classical dancers performing against the illuminated 1,000-year-old UNESCO temples."}],"food":[{"e":"🍛","name":"Bundelkhandi Thali & Mawa Bati","desc":"Traditional meal of Kodo millet, spicy Aloo-Baingan, Bedmi puris, and deep-fried mawa batis soaked in cardamom sugar syrup."}],"rituals":[{"icon":"🪔","title":"Deepotsav Inauguration","desc":"Lighting classical brass oil lamps to dedicate the performance to Lord Shiva and the Arts."}],"q":[["Against which 1,000-year-old UNESCO World Heritage monuments is the festival held?","🏛️","Khajuraho Temples|Taj Mahal|Qutub Minar|Ajanta Caves","The performances are staged against the illuminated stone facades of the Khajuraho temples."]],"g1":{"name":"Classical Temple Natya Rhythm","ty":"rhy","e":"💃","d":"Strike the ankle ghungroos in sync with Kathak & Odissi bols!","sec":30,"lanes":["🏛️","💃","🪔","✨"]},"g2":{"name":"1,000-Year Stone Sculptures Alive","ty":"mem","e":"🏛️","d":"Match celestial apsaras, stone temple spires, and oil lamps","sec":35,"pairs":["🏛️","💃","🪔","✨","🌕","🍛"]}},{"id":"diwali","name":"Diwali","e":"🪔","state":"All India","tag":"The Festival of Lights: Inner Illumination Over Spiritual Darkness","c1":"#f59e0b","c2":"#b45309","place":"Pan-India & Global Diaspora","hint":"diwali, deepavali, rama, lakshmi, diya, lights","fl":["🪔","✨","🎆","🍬","🪙"],"didYouKnow":"Did you know? Diwali is celebrated by four major world religions with different historical meanings: Hindus celebrate Lord Rama return to Ayodhya and Goddess Lakshmi worship; Jains commemorate Lord Mahavira attaining Nirvana in 527 BCE; Sikhs celebrate Bandi Chhor Divas (when Guru Hargobind Ji freed 52 Hindu kings from Gwalior Fort); and Newar Buddhists worship Lakshmi as the giver of wisdom!","story":[{"icon":"🪔","title":"The Golden Return to Ayodhya","text":"After 14 years of exile and defeating Ravana, Lord Rama, Sita, and Lakshmana returned to Ayodhya on the darkest new moon night (Amavasya) of Kartik. The citizens illuminated every street and home with earthen oil lamps, turning night into dazzling day."},{"icon":"🪙","title":"The Advent of Goddess Lakshmi","text":"On Diwali night, Goddess Lakshmi emerged during the Samudra Manthan (churning of the cosmic ocean) and chose Lord Vishnu as her eternal consort. Homes are cleaned and doorways illuminated so the Mother of spiritual and material abundance may enter."},{"icon":"✨","title":"Bandi Chhor Divas in Sikh History","text":"In 1619, the Mughal Emperor Jahangir agreed to release the sixth Sikh Guru, Guru Hargobind Ji, from Gwalior Fort. The Guru refused to leave unless 52 innocent Hindu rajas imprisoned with him were also released. The Emperor decreed only those who could hold the Guru cloak could leave. The Guru tailored a cloak with 52 tassels so all 52 kings walked out to freedom!"}],"vids":[{"title":"Diwali: The Festival of Lights Explained","ytId":"vCw4vtPjYYY","channel":"National Geographic India","desc":"Explore the profound philosophy, family warmth, and dazzling night celebrations of Diwali across India."},{"title":"Bandi Chhor Divas: The Story of Gwalior Fort","ytId":"u9P8jN1wF7M","channel":"Doordarshan Archives","desc":"The historic story of Guru Hargobind Ji liberation of 52 kings and the illumination of the Golden Temple."}],"food":[{"e":"🍬","name":"Kaju Katli & Gulab Jamun","desc":"Diamond-shaped cashew nut fudge coated in silver vark, and warm soft milk dumplings soaked in rose syrup."},{"e":"🌾","name":"Chivda & Chakli","desc":"Savory crunchy spiced rice flakes with roasted peanuts and spiral crispy gram-flour chaklis."}],"rituals":[{"icon":"🪔","title":"Deepavali Illumination","desc":"Lighting clay diyas filled with mustard or sesame oil along windowsills, rooftops, and doorsteps."},{"icon":"🪙","title":"Lakshmi-Ganesha Puja","desc":"Worshipping Goddess Lakshmi for wealth and Lord Ganesha for wisdom and auspiciousness."}],"q":[["What profound event do Sikhs celebrate on Diwali day as Bandi Chhor Divas?","✨","Guru Hargobind Ji freeing 52 innocent kings from Gwalior Fort|First harvest of wheat|Building of Anandpur Sahib|The founding of Lahore","Guru Hargobind Ji liberated 52 imprisoned kings by holding onto his 52-tasselled cloak."]],"g1":{"name":"Row of Lights Diya Sprint","ty":"tap","e":"🪔","d":"Light rows of terracotta diyas to guide Rama home!","sec":25,"tgt":"🪔","decoy":"💨"},"g2":{"name":"Lakshmi Ganesha Prosperity Match","ty":"mem","e":"🪙","d":"Match gold coins, silver vark sweets, and clay oil lamps","sec":35,"pairs":["🪔","✨","🎆","🍬","🪙","🛕"]}},{"id":"holi","name":"Holi","e":"🎨","state":"All India","tag":"The Festival of Colours: Prahlad Faith & The Triumph of Love","c1":"#e11d48","c2":"#0284c7","place":"Pan-India & Worldwide","hint":"holi, colours, prahlad, holika dahan, gulal","fl":["🎨","🌸","🔥","🍬","✨"],"didYouKnow":"Did you know? The bonfires of Holika Dahan on the eve of Holi mark the exact victory of young devotee Prahlad over his demon aunt Holika! Holika had a boon that fire could not burn her, but when she sat in a roaring blaze with Prahlad on her lap to kill him, her cloak flew off to cover Prahlad, and she burned—demonstrating that divine protection triumphs over evil arrogance!","story":[{"icon":"🔥","title":"The Legend of Prahlad & Holika","text":"The arrogant king Hiranyakashipu declared himself god and demanded worship. His young son Prahlad remained an ardent devotee of Lord Vishnu. When multiple assassination attempts failed, Holika attempted to burn Prahlad in a fire. Vishnu shielded Prahlad, and Holika was consumed by the flames."},{"icon":"🎨","title":"Colors of Equality & Spring","text":"On the morning of Rangwali Holi, all social barriers dissolve. Rich and poor, young and old embrace and smear vibrant natural powders (Gulal) on each other, declaring \"Bura na mano, Holi hai!\" (Do not take offense, it is Holi!)."}],"vids":[{"title":"Holi: The Meaning Behind the World Most Colorful Festival","ytId":"zq_E-W8jLqU","channel":"National Geographic Documentary","desc":"Discover the ancient mythology of Holika Dahan and the explosion of joy, music, and organic gulal across India."}],"food":[{"e":"🥟","name":"Gujiya & Malpua","desc":"Crisp fried sweet dumplings filled with khoya, grated coconut, and dry fruits, and saffron syrup pancakes."},{"e":"🥛","name":"Kesariya Thandai","desc":"Traditional spiced almond milk with fennel, black pepper, and fragrant rose petals."}],"rituals":[{"icon":"🔥","title":"Holika Dahan","desc":"Lighting community bonfires at night and roasting ears of green wheat to ward off negativity."}],"q":[["What does the burning of the bonfire on Holika Dahan signify?","🔥","The victory of faith (Prahlad) over evil arrogance (Holika)|The arrival of winter|Only lighting the street|Cooking community meals","It symbolizes that truth and faith withstand fire, while wickedness destroys itself."]],"g1":{"name":"Vibrant Gulal Splasher","ty":"tap","e":"🎨","d":"Spray organic powdered colors on friends and celebrate love!","sec":20,"tgt":"🎨","decoy":"💧"},"g2":{"name":"Prahlad Faith & Bonfire Match","ty":"mem","e":"🔥","d":"Match sweet crescent gujiyas, roasted green wheat, and colors","sec":30,"pairs":["🎨","🌸","🔥","🍬","✨","🥛"]}},{"id":"uttarayan","name":"Uttarayan (Kite Festival)","e":"🪁","state":"Gujarat","tag":"International Kite Festival & Makar Sankranti Solar Transition","c1":"#0284c7","c2":"#f59e0b","place":"Ahmedabad, Surat & Gujarat","hint":"uttarayan, kites, manja, kai po che, undhiyu","fl":["🪁","☀️","🍲","✨","☁️"],"didYouKnow":"Did you know? During Uttarayan, the sky over Ahmedabad and Surat is so densely packed with millions of colorful kites that you can barely see the blue sky! The rooftop shout \"Kai Po Che!\" (I have cut your kite!) echoes across cities, and at night, illuminated paper lanterns (Tukkals) float into the darkness like stars!","story":[{"icon":"☀️","title":"The Sun Enters Capricorn","text":"Uttarayan marks Makar Sankranti—the cosmic day when the Sun begins its northward journey (Uttarayan) into the sign of Capricorn (Makara). It ends the harsh winter and brings longer days, warmth, and agricultural renewal."},{"icon":"🪁","title":"Rooftop Battles & Kai Po Che","text":"From dawn to midnight, families live on their rooftops with music systems, dueling kites using glass-coated cotton thread (Manja), sharing hot Undhiyu and jalebis, and releasing flying lanterns at night."}],"vids":[{"title":"International Kite Festival: The Skies of Ahmedabad","ytId":"u9M2v1N7q4w","channel":"Gujarat Tourism Official","desc":"Witness millions of kites soaring over the Sabarmati riverfront and the night sky lit with illuminated Tukkals."}],"food":[{"e":"🍲","name":"Surti Undhiyu & Puri","desc":"Slow-cooked casserole of winter root vegetables, purple yam, fenugreek dumplings (muthias), and grated coconut in earthen pots."},{"e":"🍬","name":"Til Chikki & Jalebi","desc":"Crisp sesame seed and jaggery brittle and hot spiral saffron jalebis eaten on rooftops."}],"rituals":[{"icon":"🪁","title":"Tukkal Flying","desc":"Releasing paper lanterns with candles tied to kite strings into the night breeze."}],"q":[["What famous rooftop shout in Gujarati signals that you have severed an opponent kite string?","🪁","Kai Po Che!|Balle Balle!|Aala Re Aala!|Har Har Mahadev!","Kai Po Che means \"I have cut it!\", celebrating victory in sky kite duels."]],"g1":{"name":"Kai Po Che Sky Kite Duel","ty":"fly","e":"🪁","d":"Maneuver your kite through crosswinds and sever rival threads!","sec":30,"kite":"🪁","how":"Pull the string to dodge clouds and soar high!"},"g2":{"name":"Manja & Rooftop Lantern Match","ty":"mem","e":"☀️","d":"Match the glass-coated spools, flying lanterns, and Undhiyu","sec":30,"pairs":["🪁","☀️","🍲","✨","☁️","🍬"]}},{"id":"rann","name":"Rann Utsav","e":"🐪","state":"Gujarat","tag":"The White Salt Desert Carnival Under Full Moon Nights","c1":"#e2e8f0","c2":"#0284c7","place":"Great Rann of Kutch, Gujarat","hint":"rann of kutch, white desert, full moon, rogan art","fl":["🐪","🌕","🎨","⛺","✨"],"didYouKnow":"Did you know? The Great Rann of Kutch is one of the largest salt deserts in the world (over 7,500 square km)! Under full moon nights during Rann Utsav, the endless crystalline white salt reflects the moonlight like a sea of glowing silver and diamonds, creating a surreal dreamscape!","story":[{"icon":"🌕","title":"The Miracle of the White Desert","text":"During the monsoon, the Rann is submerged in sea water. As winter arrives, the water evaporates, leaving behind a dazzling sheet of pure white salt crystals where tribal Kutchi artisans showcase 500-year-old embroidery and music."},{"icon":"🎨","title":"Ancient Crafts of Kutch","text":"The festival celebrates the indigenous Khatri, Rabari, and Meghwal communities, renowned for rare Rogan castor-oil painting, Ajrakh block printing, and resonant Kutchi Jodiya Pawa flutes."}],"vids":[{"title":"Rann Utsav: Colors of the White Desert Under Full Moon","ytId":"m9K1p4L2r6w","channel":"Incredible India Experiences","desc":"Experience the magic of camel safaris on the glowing white salt desert, tent cities, and Kutchi tribal folklore."}],"food":[{"e":"🍲","name":"Kutchi Dabeli & Khichdi","desc":"Spiced potato mash stuffed in pav with pomegranate, roasted peanuts, and rich Kadhi Khichdi."}],"rituals":[{"icon":"🌕","title":"Full Moon Desert Walk","desc":"Walking across the shimmering white salt crust under the luminous moonlight."}],"q":[["What makes the Great Rann of Kutch landscape look like glowing silver during Rann Utsav?","🌕","Crystalline white salt reflecting full moonlight|Artificial snow|White sand dunes|Limestone rock","The vast crust of pure white salt shines like polished silver under the desert moon."]],"g1":{"name":"Full Moon Salt Desert Stride","ty":"tap","e":"🐪","d":"Navigate the glowing silver salt crust under the lunar rays!","sec":25,"tgt":"🐪","decoy":"🪨"},"g2":{"name":"Kutchi Rogan & Ajrakh Heritage","ty":"mem","e":"🌕","d":"Match the castor oil paints, mirrored mud walls, and flutes","sec":35,"pairs":["🐪","🌕","🎨","⛺","✨","🍲"]}},{"id":"gangaur","name":"Gangaur","e":"👑","state":"Rajasthan","tag":"Gauri & Shiva: The Royal Spring Celebration of Marital Devotion","c1":"#be185d","c2":"#f59e0b","place":"Jaipur, Udaipur, Jodhpur & Rajasthan","hint":"gangaur, gauri, shiva, jaipur procession","fl":["👑","🌸","🪔","💃","✨"],"didYouKnow":"Did you know? In Jaipur, the royal idol of Goddess Gauri is carried out of the City Palace through the grand Tripolia Gate in a royal procession led by caparisoned elephants, royal brass bands, and camel cavalry—a 300-year-old royal tradition attended by thousands of women dressed in red bandhani sarees!","story":[{"icon":"👑","title":"Parvati Blessing to Women","text":"Legend says Goddess Parvati visited her maternal village during spring to bless women with marital harmony and prosperity. The festival culminates with the emotional farewell as Lord Shiva (Isarji) escorts Gauri back to Mount Kailash."},{"icon":"🎨","title":"Clay Idols & Mehendi","text":"Women sculpt delicate clay idols of Isar and Gauri, decorate them with real silk dresses and miniature jewelry, plant sacred barley grass (Jowar), and apply intricate henna (mehendi) designs to their hands."}],"vids":[{"title":"Jaipur Royal Gangaur Procession at City Palace","ytId":"g8M2v1N9q4w","channel":"Rajasthan Tourism Official","desc":"Witness the centuries-old royal procession of Goddess Gauri emerging from the City Palace of Jaipur."}],"food":[{"e":"🥞","name":"Ghewar & Rabri","desc":"Honeycomb-textured disc of sweet flour drenched in saffron syrup and topped with thick malai rabri and silver leaf."}],"rituals":[{"icon":"👑","title":"Gauri Visarjan Procession","desc":"Carrying the beautifully attired brass and clay idols on heads to stepwells (baoris) and lakes."}],"q":[["Which divine couple is worshipped during Rajasthan Gangaur festival?","👑","Lord Shiva and Goddess Parvati (Isar & Gauri)|Radha and Krishna|Rama and Sita|Vishnu and Lakshmi","Gangaur celebrates the divine bond between Isar (Shiva) and Gauri (Parvati)."]],"g1":{"name":"Gauri City Palace Procession","ty":"tap","e":"👑","d":"Lead the royal elephant and brass palanquin through the gate!","sec":25,"tgt":"👑","decoy":"🛑"},"g2":{"name":"Isar & Gauri Marital Harmony","ty":"mem","e":"🌸","d":"Match sacred barley pots, red bandhani wraps, and Ghewar","sec":35,"pairs":["👑","🌸","🪔","💃","✨","🥞"]}},{"id":"teej","name":"Teej Festival","e":"🌿","state":"Rajasthan","tag":"The Monsoon Swings & Parvati Reunion After 108 Births","c1":"#16a34a","c2":"#ca8a04","place":"Jaipur, Bundi & Northern India","hint":"teej, haryali teej, monsoon, swings, ghewar","fl":["🌿","🌧️","💃","🍯","✨"],"didYouKnow":"Did you know? Legend says Goddess Parvati underwent 108 penances and rebirths to win the love of Lord Shiva! On the 108th birth during the monsoon month of Shravana, Shiva was deeply moved by her steadfast devotion and accepted her as his eternal consort!","story":[{"icon":"🌿","title":"Haryali Teej: Nature in Bloom","text":"When the first monsoon rains quench the parched soils of Rajasthan, nature turns lush emerald green. Women celebrate Haryali Teej wearing green Leheriya sarees and bangles, honoring fertility and the earth."},{"icon":"🎪","title":"Floral Swings on Banyan Trees","text":"Ornate wooden swings decorated with fresh jasmine and marigolds are suspended from ancient banyan and mango branches. Women and girls swing high into the rain breeze, singing traditional Teej folk songs."}],"vids":[{"title":"Teej Festival: Monsoon Swings & Royal Heritage of Jaipur","ytId":"r7K4p2L1r6w","channel":"Incredible India Heritage","desc":"Experience the green Leheriya sarees, the Teej Mata royal palanquin procession, and festive Ghewar sweet making."}],"food":[{"e":"🥞","name":"Malai Ghewar","desc":"Traditional Rajasthani monsoon honeycomb dessert crowned with creamy clotted rabri, pistachios, and saffron."}],"rituals":[{"icon":"🎪","title":"Swinging on the Jhula","desc":"Taking turns on flower-decked swings hung from banyan trees while singing monsoon ballads."}],"q":[["Why do women predominantly wear green Leheriya sarees during Haryali Teej?","🌿","To celebrate the green rejuvenation of nature after monsoon rains|Because green was the king favorite color|To blend into the forest|To ward off heat","Green symbolizes the lush blossoming of the earth and fields after summer."]],"g1":{"name":"Monsoon Banyan Tree Swing","ty":"tap","e":"🌿","d":"Propel the flower-decked swing into the fresh rain clouds!","sec":25,"tgt":"🌿","decoy":"🍂"},"g2":{"name":"Green Leheriya & Malai Ghewar","ty":"mem","e":"🌧️","d":"Match the emerald sarees, rain swallows, and sweet delicacies","sec":30,"pairs":["🌿","🌧️","💃","🍯","✨","🥞"]}},{"id":"nuakhai","name":"Nuakhai","e":"🌾","state":"Odisha","tag":"Western Odisha: The Sacred New Harvest & The Nuakhai Juhar Reconciliation","c1":"#b45309","c2":"#15803d","place":"Sambalpur, Western Odisha","hint":"nuakhai, samaleswari, new rice, nuakhai juhar","fl":["🌾","🍯","🙏","🛕","✨"],"didYouKnow":"Did you know? Nuakhai features the heartwarming ritual of \"Nuakhai Juhar\"—a universal reconciliation where all past grudges, disputes, and quarrels are forgiven and forgotten! Younger family members bow down to touch elders feet to seek blessings, and friends hug each other with open hearts!","story":[{"icon":"🌾","title":"Offering the First Grain (Nabanna)","text":"The festival dates back to the Vedic era. Before a single grain of the newly harvested paddy crop is consumed, the earliest harvest (Nabanna) is cooked in new earthen pots and offered to Goddess Samaleswari in Sambalpur and Patneswari in Bolangir."},{"icon":"🙏","title":"Nuakhai Juhar & Sambalpuri Folk","text":"After the sacred family feast, people don colorful Sambalpuri handloom kurtas and sarees, gather in community squares for Nuakhai Bhetghat, and dance the energetic Dalkhai and Rasarkeli to the beats of the Dhol, Nishan, and Tasa."}],"vids":[{"title":"Nuakhai: Western Odisha Beautiful Harvest & Reconciliation","ytId":"n7M2v4N1q8w","channel":"Doordarshan Odisha","desc":"Explore the Nabanna offering to Maa Samaleswari, the warm Nuakhai Juhar tradition, and vibrant Sambalpuri folk dances."}],"food":[{"e":"🍚","name":"Nabanna & Arisa Pitha","desc":"The sacred new harvest rice cooked with milk, jaggery, grated coconut, and crisp fried jaggery-rice cakes (Arisa Pitha)."}],"rituals":[{"icon":"🙏","title":"Nuakhai Juhar","desc":"Touching the feet of elders and embracing peers to start the year with zero grudges or bitterness."}],"q":[["What is the unique purpose of the \"Nuakhai Juhar\" custom during Nuakhai?","🙏","To forgive all past disputes, reconcile, and seek elders blessings|To buy new livestock|To start a business|To cook together","It is a sacred social custom of universal reconciliation and mutual forgiveness."]],"g1":{"name":"Nabanna First Harvest Offering","ty":"tap","e":"🌾","d":"Harvest the first fragrant rice crop for Goddess Samaleswari!","sec":25,"tgt":"🌾","decoy":"🍂"},"g2":{"name":"Nuakhai Juhar Reconciliation","ty":"mem","e":"🙏","d":"Match the elder blessings, Sambalpuri weaves, and Arisa Pitha","sec":30,"pairs":["🌾","🍯","🙏","🛕","✨","🍚"]}},{"id":"balijatra","name":"Bali Jatra","e":"⛵","state":"Odisha","tag":"Asia Largest Open-Air Fair & Commemorating Ancient Maritime Voyages","c1":"#0284c7","c2":"#d97706","place":"Mahanadi River Bank, Cuttack, Odisha","hint":"bali jatra, sadhabas, boita bandana, cuttack","fl":["⛵","🌊","🪔","🎪","✨"],"didYouKnow":"Did you know? Bali Jatra commemorates ancient Odia mariners (Sadhabas) who sailed across thousands of miles of rough ocean in massive wooden merchant ships (Boitas) to trade with Bali, Java, Sumatra, and Sri Lanka! Today, Cuttack hosts Asia largest open-air trade carnival spanning over 500 acres on the banks of the Mahanadi river!","story":[{"icon":"⛵","title":"The Ancient Spice Mariners of Kalinga","text":"On Kartik Purnima, favorable northeast trade winds began blowing. Merchant sailors bid emotional farewells to their families and set sail for Southeast Asian islands with spices, handlooms, and gemstones, making ancient Kalinga one of the greatest maritime empires in Asia."},{"icon":"🪔","title":"Boita Bandana at Dawn","text":"At dawn on Kartik Purnima, thousands of people gather at rivers and ponds to float miniature toy boats made of banana stem, cork, and betel leaves holding burning lamps, betel nuts, and coins, chanting \"Aa Ka Ma Boi, Paan Gua Thoi\"."}],"vids":[{"title":"Bali Jatra: The Maritime Glory of Ancient Kalinga","ytId":"o9K3p1L4r6w","channel":"Doordarshan Heritage","desc":"Witness the dawn floating of miniature boats (Boita Bandana) and the colossal 500-acre fair on the Mahanadi in Cuttack."}],"food":[{"e":"🍲","name":"Cuttack Dahi Bara Aloo Dum","desc":"Lentil vadas soaked in spiced buttermilk, topped with fiery potato-pea curry, sev, and chopped coriander."},{"e":"🍬","name":"Thunka Puri & Chenna Gaja","desc":"Crispy giant puris served with spicy gravy and caramelized fried cottage cheese sweets."}],"rituals":[{"icon":"⛵","title":"Boita Bandana","desc":"Floating miniature paper and banana-stem boats with burning lamps into water bodies at sunrise."}],"q":[["Which Southeast Asian islands did ancient Odia mariners (Sadhabas) sail to for trade?","⛵","Bali, Java, Sumatra, and Sri Lanka|Japan and Korea|Madagascar|Australia","Kalinga mariners established extensive trade networks across Bali, Java, Sumatra, and Southeast Asia."]],"g1":{"name":"Boita Bandana Toy Boat Launch","ty":"tap","e":"⛵","d":"Float the banana stem boats with burning lamps on the river!","sec":25,"tgt":"⛵","decoy":"🌊"},"g2":{"name":"Ancient Spice Mariner Routes","ty":"mem","e":"🌊","d":"Match the spice caravels, silver coins, and Mahanadi sails","sec":35,"pairs":["⛵","🌊","🪔","🎪","✨","🍲"]}},{"id":"bonalu","name":"Bonalu","e":"🏺","state":"Telangana","tag":"Hyderabad & Secunderabad: Mahakali Thanksgiving & The Pothuraju Whip Dance","c1":"#b91c1c","c2":"#ca8a04","place":"Golconda, Secunderabad & Hyderabad","hint":"bonalu, mahakali, pothuraju, ujjaini mahankali","fl":["🏺","🔥","🪘","🌿","✨"],"didYouKnow":"Did you know? Bonalu originated in 1813 during a catastrophic plague outbreak in Hyderabad and Secunderabad. A Hyderabadi military battalion stationed in Ujjain prayed to Goddess Mahakali to eradicate the epidemic. When the plague subsided, the people instituted this thanksgiving festival, carrying decorated brass pots of rice and jaggery on their heads!","story":[{"icon":"🏺","title":"The Offering of Bonam","text":"\"Bonam\" comes from the Sanskrit word Bhojanam (feast). Women dressed in silk sarees carry brass or earthen pots decorated with turmeric, vermilion, and fresh neem leaves, balanced on their heads with a lit oil lamp on top to feed and appease the Mother Goddess."},{"icon":"🪘","title":"The Fierce Pothuraju Dance","text":"The brother of the Goddess, \"Pothuraju\", is portrayed by a bare-chested warrior with bells on his ankles, smeared with turmeric and vermilion. Wielding a heavy leather whip, he dances fiercely to thunderous Teen Maar drum beats to clear evil spirits from the path."}],"vids":[{"title":"Bonalu: The Fierce & Colorful Spirit of Hyderabad","ytId":"b9M1v4N7q3w","channel":"Telangana Tourism Official","desc":"Experience the Golconda and Secunderabad Bonalu processions, the hypnotic Pothuraju whip dances, and Teen Maar beats."}],"food":[{"e":"🍲","name":"Bellam Annam (Jaggery Rice)","desc":"Newly harvested rice cooked with milk, jaggery, cardamom, and pure ghee in decorated brass pots."}],"rituals":[{"icon":"🪘","title":"Pothuraju Whip Cracking","desc":"Dancing with rhythmic whip strikes to protect the women carrying the sacred Bonam pots."}],"q":[["Who is the fierce character who leads the Bonalu procession wielding a leather whip?","🪘","Pothuraju (Brother of Goddess Mahakali)|The Village Head|The High Priest|The King Guard","Pothuraju, revered as the protector brother of the Goddess, dances with a whip to ward off evil energies."]],"g1":{"name":"Pothuraju Whip Dancing Strike","ty":"tap","e":"🪘","d":"Crack the leather whip to protect the sacred Bonam pots!","sec":20,"tgt":"🪘","decoy":"🛑"},"g2":{"name":"Mahankali Turmeric Pot Harmony","ty":"mem","e":"🏺","d":"Match neem twigs, decorated brass vessels, and street lamps","sec":30,"pairs":["🏺","🔥","🪘","🌿","✨","🍲"]}},{"id":"ambubachi","name":"Ambubachi Mela","e":"🌺","state":"Assam","tag":"Kamakhya Temple: The Sacred Monsoon Fertility of Mother Earth","c1":"#dc2626","c2":"#7c3aed","place":"Kamakhya Temple, Nilachal Hill, Guwahati, Assam","hint":"ambubachi, kamakhya, nilachal, tantra, mother earth","fl":["🌺","🌊","🛕","🪔","✨"],"didYouKnow":"Did you know? Kamakhya Temple has no idol or statue in its inner sanctum! Instead, it enshrines a natural stone cleft shaped like a yoni (womb) fed by a continuous subterranean natural spring. During Ambubachi, the temple doors remain completely closed for three days while the mother earth undergoes her annual fertility cycle!","story":[{"icon":"🛕","title":"The Shakti Peetha on Nilachal Hill","text":"When Lord Shiva carried the charred body of Sati in his sorrowful Tandava, Lord Vishnu released his Sudarshana Chakra to sever the body into 51 pieces. Sati yoni (womb of creation) fell on Nilachal Hill, making Kamakhya the supreme center of divine feminine power (Mahapitha)."},{"icon":"🧣","title":"Raktavastra (The Sacred Red Cloth)","text":"On the 4th day, when the temple doors reopen, millions of tantric sadhus, Baul singers, and devotees receive a piece of the sacred red cloth (Angodak/Raktavastra) dipped in the natural spring water, revered as a blessing of supreme healing and protection."}],"vids":[{"title":"Ambubachi Mela: The Mystical Tantra Festival of Kamakhya","ytId":"a9M1v7N2q4w","channel":"Discovery Channel India","desc":"Explore the fascinating rituals, tantric sadhus, and the reopening of the sacred womb shrine at Kamakhya Temple."}],"food":[{"e":"🥣","name":"Kamakhya Mahaprasad & Kheer","desc":"Pure vegetarian rice and split-chana dal khichuri cooked without onion or garlic, seasoned with ginger and whole spices."}],"rituals":[{"icon":"🧣","title":"Raktavastra Distribution","desc":"Receiving the sanctified red cloth distributed to devotees when the temple doors swing open on the 4th morning."}],"q":[["What is uniquely enshrined in the inner sanctum of the Kamakhya Temple instead of an idol?","🛕","A natural bedrock cleft fed by an underground spring|A golden statue|A wooden chariot|A sacred tree","The temple enshrines a natural rock cleft fed by a spring, symbolizing the source of cosmic creation."]],"g1":{"name":"Nilachal Spring Water Blessing","ty":"tap","e":"🌺","d":"Receive the sanctified red cloth from the sacred subterranean spring!","sec":25,"tgt":"🌺","decoy":"🌑"},"g2":{"name":"Kamakhya Tantric Shrine Lore","ty":"mem","e":"🛕","d":"Match vermilion marks, brass conch shells, and sacred incense","sec":35,"pairs":["🌺","🌊","🛕","🪔","✨","🧣"]}},{"id":"chapchar","name":"Chapchar Kut","e":"🎋","state":"Assam","tag":"Mizoram: The Joyful Post-Jhum Carnival & The Cheraw Bamboo Dance","c1":"#16a34a","c2":"#eab308","place":"Aizawl & Across Mizoram","hint":"chapchar kut, cheraw dance, bamboo dance, mizo","fl":["🎋","💃","🥁","🌸","✨"],"didYouKnow":"Did you know? Chapchar Kut is famous worldwide for the \"Cheraw\" (Bamboo Dance)! Pairs of men sit on the ground clapping heavy horizontal bamboo poles in rapid, syncopated 4/4 rhythm, while graceful Mizo dancers leap in and out between the snapping poles with millisecond precision without ever getting their ankles caught!","story":[{"icon":"🎋","title":"The Feast After Clearing the Bamboo Hills","text":"In the 15th century, Mizo villagers completed the arduous labor of felling dense mountain bamboo forests for shifting cultivation (Jhum). While waiting for the bamboo to dry under the March sun before burning, the village chief declared a spontaneous holiday of feasting, dance, and song."},{"icon":"💃","title":"The Grace of Cheraw and Chai","text":"Dressed in colorful traditional Puanchei handwoven wraps and feather headdresses (Vakiria), women perform the Cheraw and Chai dances while elders play the Khuang (Mizo drum) and mithun horn bugles."}],"vids":[{"title":"Cheraw Bamboo Dance at Chapchar Kut in Mizoram","ytId":"c9M1v8N4q2w","channel":"Incredible India Culture","desc":"Watch the breathtaking Cheraw bamboo dance where dancers leap gracefully between rhythmic clapping bamboo poles in Aizawl."}],"food":[{"e":"🍲","name":"Bai & Vawksa Rep","desc":"Nutritious steamed vegetable stew made with mustard leaves, local beans, bamboo shoot, and aromatic fermented pork."}],"rituals":[{"icon":"🎋","title":"Cheraw Bamboo Rhythm","desc":"Clapping bamboo poles together on the ground in rapid synchronization while dancers step across the grid."}],"q":[["What is the world-renowned traditional dance performed with clapping bamboo poles in Mizoram?","🎋","Cheraw Dance (Bamboo Dance)|Bihu|Garba|Kathak","The Cheraw dance is the iconic bamboo dance of the Mizo people, requiring superb agility and rhythmic timing."]],"g1":{"name":"Cheraw   // Upgraded V.Watch (High-Definition YouTube Video Hub with Direct Video Player)
  window.V = window.V || {};
  window.V.Watch = function() {

              <span style="color:var(--gold); font-size:0.85rem; font-weight:600;">${activeVid.channel}</span>
            </div>
            <h2 style="margin:0 0 8px 0; font-size:1.4rem; color:#fff; font-weight:700;">${activeVid.title}</h2>
            <p style="margin:0; font-size:0.95rem; color:#a1a1aa; line-height:1.5;">${activeVid.desc}</p>
          </div>

          <div>
            <a href="https://www.youtube.com/watch?v=${activeVid.ytId}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;">
              <button type="button" style="background:linear-gradient(135deg,#ff0000,#cc0000); color:#fff; border:none; padding:12px 22px; border-radius:30px; font-size:0.95rem; font-weight:bold; cursor:pointer; display:flex; align-items:center; gap:8px; box-shadow:0 4px 15px rgba(255,0,0,0.4); transition:all 0.2s;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                Watch on YouTube App / Web ↗

        </div>

      <h3 style="margin:0 0 14px 0; font-size:1.2rem; color:var(--ink); display:flex; align-items:center; gap:8px;">
        <span>🎬</span> More Top Videos &amp; Documentaries for ${g.name}:

      <div class="grid" style="grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px;">
        ${vids.map((v, idx) => {
          const isCurrent = (idx === activeIdx);
          return `<div class="card" style="background:${isCurrent ? 'rgba(245,158,11,0.1)' : 'var(--card)'}; border:2px solid ${isCurrent ? '#f59e0b' : 'var(--line)'}; border-radius:14px; padding:14px; cursor:pointer; display:flex; flex-direction:column; justify-content:space-between; transition:all 0.2s;"
                       onclick="window.R.vid=${idx}; window.draw();">

        }).join('')}

        <span style="font-size:0.95rem; color:var(--mut); margin-right:12px;">Looking for more cultural documentaries or cooking recipes?</span>
        <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(g.name + ' festival documentary history rituals')}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;">
          <button class="alt" style="border-radius:20px; padding:8px 18px; font-size:0.9rem; font-weight:bold;">
            🔍 Search More "${g.name}" on YouTube ↗
          </button>
        </a>
      </div>
    </div>`;
  };

  // Re-export pick to handle deep page links and state sync
  const origPick = window.pick;
  window.pick = function(id, targetPage) {
    window.cur = id;
    try { cur = id; } catch(e) {}
    if (typeof origPick === 'function') {
      try { origPick(id); } catch(e) {}
    }
    if (typeof window.applyTheme === 'function') {
      window.applyTheme(id);
    }
    if (targetPage && typeof window.go === 'function') {
      window.go(targetPage);
    } else if (typeof window.draw === 'function') {
      window.draw();
    }
  };

  // Auto-launch Curated 50 Festivals Hub on root or #Festivals
  if (typeof window.go === 'function' && (!location.hash || location.hash === '#Festivals' || location.hash === '#' || location.hash === '#Choose')) {
    window.go('Festivals');
  }
})();

</script>
